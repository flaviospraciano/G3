<meta name="theme-color" content="#FBFCFF">
<meta name="color-scheme" content="light dark">
<script>try{if(localStorage.getItem("g3_theme_ver")!=="3"){localStorage.setItem("g3_theme","leve");localStorage.setItem("g3_theme_ver","3");}var _t=localStorage.getItem("g3_theme")||"leve";if(_t==="auto")_t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"leve";if(_t!=="dark")_t="leve";document.documentElement.dataset.theme=_t;}catch(e){}</script>
<meta name="g3-version" content="2.0.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="G3">
<style>
:root{--bg:#0B0B0D;--sf:#17171B;--sf2:#212127;--sf3:#2C2C34;--line:#3A3A44;--ink:#FFFFFF;--soft:#C9C5BB;--faint:#9A968C;--gold:#FFC233;--gold2:#FFD966;--goldd:#B8860B;--btn:#FFC233;--btntx:#111111;
--ghost:#2A2A31;--ghostbd:#55555F;--ghosttx:#FFFFFF;--link:#FFD24D;--red:#F0443F;--org:#FF9F1A;--grn:#2FC46B;--blue:#5B9BFF;--danger:#FF7A75;
--topbg:rgba(11,11,13,.94);--navbg:rgba(18,18,22,.98);--thbg:#2B2410;--thtx:#FFD966;--thbd:#5A4A1C;--zebra:#1D1D22;--toastbg:#24201A;--toastbd:#6B5520;--herobg:linear-gradient(160deg,#211B0C,#0F0F12);--herobd:#5C4A1A;--herotx:#FFF1C8;
--cr:rgba(240,68,63,.24);--crt:#FFB1AE;--co:rgba(255,159,26,.24);--cot:#FFD08A;--cg:rgba(47,196,107,.24);--cgt:#A6F2C4;--r:16px;color-scheme:dark;--disp:Georgia,"Times New Roman",serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="light"]{--bg:#F6F4EF;--sf:#FFFFFF;--sf2:#F0EDE5;--sf3:#E4DFD3;--line:#D5CFC1;--ink:#15130E;--soft:#4F4A3E;--faint:#7A7466;--gold:#E0A100;--gold2:#B07D00;--goldd:#8A6200;--btn:#FFC233;--btntx:#111111;
--ghost:#FFFFFF;--ghostbd:#B9B2A2;--ghosttx:#15130E;--link:#9A6A00;--red:#D7322D;--org:#E67E00;--grn:#1E9E50;--blue:#1E62D0;--danger:#C62828;
--topbg:rgba(246,244,239,.95);--navbg:rgba(255,255,255,.98);--thbg:#15130E;--thtx:#FFD24D;--thbd:#15130E;--zebra:#FAF8F3;--toastbg:#15130E;--toastbd:#15130E;--herobg:linear-gradient(160deg,#FFF4D6,#FFFFFF);--herobd:#EBCB7A;--herotx:#3A2E10;
--cr:#FDE3E1;--crt:#B3201B;--co:#FFEBD0;--cot:#9A4F00;--cg:#DDF5E6;--cgt:#146C37;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hidden{display:none!important}
.app{max-width:760px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;margin:0 -14px;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font:700 1.08rem var(--body);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:var(--ghost);border:2px solid var(--ghostbd);color:var(--ghosttx);width:38px;height:38px;border-radius:12px;font-size:1.2rem;flex:none}
.ava{width:34px;height:34px;border-radius:10px;object-fit:cover;background:var(--sf3);flex:none;border:1px solid var(--line)}
.ava.lg{width:72px;height:72px;border-radius:18px}.ava.xl{width:180px;height:180px;border-radius:24px}
.logo{width:40px;height:40px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--btn);color:var(--btntx);box-shadow:0 3px 0 rgba(0,0,0,.25);text-decoration:none;forced-color-adjust:none}
.btn.ghost{background:var(--ghost);color:var(--ghosttx);border:2px solid var(--ghostbd);box-shadow:none}.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:11px}.btn.full{width:100%}.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--link);font-weight:800;padding:6px;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lbl{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.muted{color:var(--soft)}.small{font-size:.88rem}.tiny{font-size:.76rem}
.fld{display:block;margin:10px 0}.fld span{display:block;font-size:.8rem;font-weight:700;color:var(--soft);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.fld textarea{min-height:90px;resize:vertical}.cnt{font-size:.74rem;color:var(--faint);text-align:right;margin-top:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--line);background:var(--sf2);border-radius:10px;padding:7px 11px;font-weight:700;font-size:.86rem}
.seg button[aria-pressed="true"]{border-color:var(--btn);background:var(--btn);color:var(--btntx)}
/* status */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.76rem;white-space:nowrap}
.st.r{background:var(--red);color:#FFFFFF}.st.o{background:var(--org);color:#1A1000}.st.g{background:var(--grn);color:#FFFFFF}.st.n{background:var(--sf3);color:var(--soft)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
/* home */
.hero{margin-top:14px;border-radius:22px;padding:18px;background:var(--herobg);border:2px solid var(--herobd)}
.hero h2{font:700 1.5rem/1.15 var(--disp);margin:6px 0 0}.hero .q{margin:14px 0 0;font:italic 1.04rem/1.45 var(--disp);color:var(--herotx)}.hero .a{font-size:.84rem;color:var(--gold2);margin-top:6px;font-weight:800}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:104px;position:relative}
.mi .e{font-size:1.5rem}.mi b{font-size:.98rem}.mi span{font-size:.78rem;color:var(--soft)}
.mi .bd{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 7px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.task .ic{font-size:1.15rem;width:24px;text-align:center}
.empty{color:var(--faint);font-size:.88rem;padding:6px 0}
/* listas */
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item .e{font-size:1.35rem;width:34px;height:34px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;flex:none}
.item b{display:block}.item .chev{color:var(--faint);font-size:1.2rem}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem;margin:12px 0 4px}.crumbs button{background:none;border:0;color:var(--gold2);padding:2px 4px;font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:18px;border:0;font-size:1.8rem;font-weight:800;background:var(--btn);color:var(--btntx);box-shadow:0 10px 24px rgba(0,0,0,.5)}
/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--navbg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.62rem;font-weight:700;color:var(--faint);padding:4px 0;position:relative}
.nav button .i{font-size:1.25rem}.nav button[aria-current="true"]{color:var(--gold2)}.nav button[aria-current="true"] .i{transform:scale(1.12)}
.nav .bd{position:absolute;top:0;right:22%;background:var(--red);color:#fff;border-radius:99px;font-size:.62rem;padding:0 5px}
/* folha (modal) */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--sf);border:1px solid var(--line);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}.sheet h2{font:700 1.2rem var(--body);margin:0 0 6px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:.7rem;color:var(--faint);text-align:center;font-weight:800}
.cal button{aspect-ratio:1;border:1px solid transparent;background:var(--sf);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.9rem;padding:0}
.cal button.out{opacity:.3}.cal button.td{border-color:var(--gold)}.cal button.sel{background:var(--btn);color:var(--btntx)}
.cal .dots{display:flex;gap:2px;height:5px}.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--gold2)}.cal button.sel .dots i{background:var(--btntx)}
.ev{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ev .t{font-weight:800;font-size:.86rem;color:var(--gold2);min-width:46px}
/* planilha */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.sum div:last-child{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sum div:last-child b{display:flex;gap:6px}
.sum div{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.sum b{display:block;font-size:1.05rem}.sum span{font-size:.72rem;color:var(--soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tools input{flex:1;min-width:140px;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:68vh;background:var(--sf)}
table.sh{border-collapse:separate;border-spacing:0;font-size:.86rem;min-width:100%}
.sh th{position:sticky;top:0;z-index:2;background:var(--thbg);color:var(--thtx);font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:9px 10px;white-space:nowrap;border-bottom:2px solid var(--thbd)}
.sh td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.sh td>button{display:block;width:100%;min-height:42px;text-align:left;background:none;border:0;padding:8px 10px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.sh tr:nth-child(even) td{background:var(--zebra)}
.sh .c0{position:sticky;left:0;z-index:1;background:var(--sf)!important;font-weight:700;box-shadow:2px 0 0 var(--line)}.sh td.c0>button{max-width:150px;white-space:normal;line-height:1.25}@media (min-width:600px){.sh td.c0>button{max-width:240px}}.sh th.c0{z-index:3;background:var(--thbg)!important}
.sh td.r>button{background:var(--cr);color:var(--crt);font-weight:800}.sh td.o>button{background:var(--co);color:var(--cot);font-weight:800}.sh td.g>button{background:var(--cg);color:var(--cgt);font-weight:800}
.money{font-variant-numeric:tabular-nums;text-align:right!important}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px;font-weight:700}
.opt.on{border:2px solid var(--gold);background:var(--sf3)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.dot.r{background:var(--red)}.dot.o{background:var(--org)}.dot.g{background:var(--grn)}.dot.n{background:var(--faint)}
/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(30px + env(safe-area-inset-top,0px)) 18px 30px;background:var(--herobg)}
.auth .box{width:100%;max-width:420px}.auth h1{font:700 1.7rem var(--disp);text-align:center;margin:12px 0 2px}
.photo-pick{display:flex;align-items:center;gap:12px}.photo-pick img{width:84px;height:84px;border-radius:18px;object-fit:cover;background:var(--sf3);border:1px solid var(--line)}
.demo{background:var(--co);border:2px solid var(--org);color:var(--cot);font-weight:700;border-radius:12px;padding:10px 12px;font-size:.82rem;margin-top:12px}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--toastbg);color:#FFFFFF;border:2px solid var(--toastbd);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .25s}
.toast .e{font-size:1.3rem}.toast b{display:block}.toast span{font-size:.82rem;color:#E6E1D5}

@media (min-width:700px){.menu{grid-template-columns:repeat(3,1fr)}}

.theme{background:var(--ghost);border:2px solid var(--ghostbd);width:38px;height:38px;border-radius:12px;font-size:1.1rem;flex:none}
.danger{color:var(--danger)!important;border-color:var(--danger)!important}
.exit{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.exit .box{background:var(--sf);border:2px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:360px;text-align:center}
.exit h2{font:800 1.25rem var(--body);margin:8px 0 6px}

.logo.sm{width:26px;height:26px;margin-left:-2px}
.foot{text-align:center;color:var(--soft);font-size:.98rem;margin:30px 0 6px;line-height:1.4}.foot b{color:var(--ink);font-weight:800}
.foot .flat{width:84px;display:block;margin:0 auto 8px}:root[data-theme="light"] .foot .flat{background:transparent;filter:drop-shadow(0 0 1px rgba(0,0,0,.85)) drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.calcbtn{margin-top:22px;padding:16px;font-size:1.05rem;background:linear-gradient(135deg,var(--grn),#1A8F4A);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.years{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}.yr{background:var(--sf);border:2px solid var(--ghostbd);border-radius:16px;padding:12px;text-align:left;color:var(--ink)}
.yr b{display:block;font-size:1.5rem;line-height:1.1}.yr span{font-size:.8rem;color:var(--soft)}.yr.on{background:var(--btn);border-color:var(--btn);color:var(--btntx)}.yr.on span{color:var(--btntx)}
:root{--evbg:rgba(255,194,51,.26)}:root[data-theme="light"]{--evbg:#FFE7A1}
.cal button.has{background:var(--evbg);border:2px solid var(--gold);font-weight:900}.cal button.has .dots i{background:var(--red);width:6px;height:6px}
.cal button.td{border:2px solid var(--blue)}.cal button.sel{background:var(--btn);color:var(--btntx);border-color:var(--btn)}
.ev{border-left:6px solid var(--btn)}
.profit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.profit .pc{border-radius:16px;padding:12px;border:2px solid}
.profit .pc span{display:block;font-size:.78rem;font-weight:800}.profit .pc b{display:block;font-size:1.35rem;margin:2px 0}.profit .pc small{font-size:.74rem;opacity:.85}
.profit .ok{background:var(--cg);border-color:var(--grn);color:var(--cgt)}.profit .ideal{background:var(--evbg);border-color:var(--gold);color:var(--ink)}
.profit.sm .pc b{font-size:1.1rem}.profit.sm{margin:0 0 16px}
.item.hl{border:2px solid var(--gold);background:var(--evbg)}
.msg{margin-bottom:10px}.msg .mt{white-space:pre-wrap;background:var(--sf2);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.taxhd{background:linear-gradient(135deg,#1E8E3E,#0B5D24);color:#fff;padding:12px 14px}.taxhd b{display:block;font-size:1.2rem}.taxhd span{font-size:.82rem;opacity:.9}
table.tax{width:100%;border-collapse:collapse}table.tax th{background:#7BD389;color:#0B3D18;text-align:left;padding:8px 14px}table.tax th:last-child{background:#0B5D24;color:#fff}
table.tax td{padding:8px 14px;border-bottom:1px solid var(--line);font-weight:700}table.tax td:last-child{font-size:1.05rem;color:var(--ink)}
.lhead{margin:22px 0 8px;display:flex;flex-direction:column;gap:6px}.lhead b{font-size:1.08rem}
/* ===== TEMA LEVE (claro e fino) ===== */
:root[data-theme="leve"]{--bg:#FBFCFF;--sf:#FFFFFF;--sf2:#F6F8FF;--sf3:#ECF0FC;--line:#EAEEF9;--ink:#2A3150;--soft:#667091;--faint:#9AA2BF;--gold:#F5B63D;--gold2:#B8730A;--goldd:#9A5F08;--btn:#FFD966;--btntx:#3A2600;--ghost:#FFFFFF;--ghostbd:#DDE3F5;--ghosttx:#2A3150;--link:#5B54D6;--red:#F26B7B;--org:#FFA64D;--grn:#3CC98A;--blue:#6AA3F8;--danger:#E04A5E;--topbg:rgba(255,255,255,.92);--navbg:rgba(255,255,255,.97);--thbg:#F5F7FF;--thtx:#5560B5;--thbd:#E8ECFA;--zebra:#FCFDFF;--toastbg:#FFFFFF;--toastbd:#EAEEF9;--herobg:linear-gradient(135deg,#FFF1BF 0%,#FFE3B8 60%,#FFD6D6 120%);--herobd:#FFE7A8;--herotx:#4A3300;--cr:#FFEAEE;--crt:#C93349;--co:#FFF2E0;--cot:#B8650A;--cg:#E3F9EE;--cgt:#12885A;--r:12px;--evbg:#FFF6D6;color-scheme:light}
[data-theme=leve] .back,[data-theme=leve] .theme{background:var(--sf);border-radius:12px}
[data-theme=leve] .btn{box-shadow:none;border-radius:12px}
[data-theme=leve] .card,[data-theme=leve] .item,[data-theme=leve] .mi,[data-theme=leve] .ev,[data-theme=leve] .sum div,[data-theme=leve] .wrap,[data-theme=leve] .meta,[data-theme=leve] .kpi{box-shadow:0 1px 2px rgba(40,34,10,.04)}
[data-theme=leve] .st.r{background:var(--cr);color:var(--crt)}[data-theme=leve] .st.o{background:var(--co);color:var(--cot)}[data-theme=leve] .st.g{background:var(--cg);color:var(--cgt)}
[data-theme=leve] .st.r::before{background:var(--red)}[data-theme=leve] .st.o::before{background:var(--org)}[data-theme=leve] .st.g::before{background:var(--grn)}
[data-theme=leve] .mini{box-shadow:0 2px 8px rgba(40,34,10,.12)}
[data-theme=leve] .icard{box-shadow:0 1px 2px rgba(40,34,10,.04)}
[data-theme=leve] .sheet{background:rgba(35,30,15,.32)}
[data-theme=leve] .sheet .in{box-shadow:0 -8px 30px rgba(40,34,10,.12)}
[data-theme=leve] .toast{color:var(--ink);box-shadow:0 8px 24px rgba(40,34,10,.14)}
[data-theme=leve] .toast span{color:var(--soft)}
[data-theme=leve] .exit{background:rgba(35,30,15,.35)}
[data-theme=leve] .yr.on{border-color:var(--btn)}
[data-theme=leve] .taxhd{background:#EAF6EE;color:#17663A}
[data-theme=leve] table.tax th{background:#F3F8F4;color:#2D6B45}[data-theme=leve] table.tax th:last-child{background:#DFF1E5;color:#17663A}
[data-theme=leve] .calcbtn{background:var(--grn);box-shadow:none}

/* ===== VISUAL VIBRANTE (modo claro) ===== */
[data-theme=leve] body{background:linear-gradient(180deg,#F1F5FF 0,#FBFCFF 260px)}
[data-theme=leve] .top{border-bottom-color:transparent;box-shadow:0 4px 14px rgba(60,70,150,.05)}
[data-theme=leve] .btn:not(.ghost):not(.calcbtn):not(.danger){background:linear-gradient(135deg,#FFE58A,#FFCF70);box-shadow:0 3px 10px rgba(255,190,60,.25)}
[data-theme=leve] .yr.on{background:linear-gradient(135deg,#FFEB9E,#FFD98A);border-color:transparent}
[data-theme=leve] .fab{background:linear-gradient(135deg,#FFE58A,#FFCB6B);box-shadow:0 6px 16px rgba(255,180,50,.32)}
[data-theme=leve] .hero{box-shadow:0 6px 18px rgba(255,190,90,.18);border-color:transparent}
[data-theme=leve] .hero *{color:var(--herotx)!important}
[data-theme=leve] .nav button[aria-current="true"]{color:#C9780A}
[data-theme=leve] .item .e{background:#FFF6D9}
[data-theme=leve] .menu .mi .e{background:#FFF6D9}
[data-theme=leve] .menu .mi:nth-child(5n+2) .e{background:#E6EEFF}[data-theme=leve] .menu .mi:nth-child(5n+3) .e{background:#E3F8EE}[data-theme=leve] .menu .mi:nth-child(5n+4) .e{background:#FFE9ED}[data-theme=leve] .menu .mi:nth-child(5n) .e{background:#F0E7FF}
[data-theme=leve] .lbl{color:#8088AD}
[data-theme=leve] .bar i{background:linear-gradient(90deg,#FFD966,#FFBE55)}
[data-theme=leve] .bar.g i{background:linear-gradient(90deg,#3CC98A,#7BE0B3)}[data-theme=leve] .bar.o i{background:linear-gradient(90deg,#FFA64D,#FFC888)}[data-theme=leve] .bar.r i{background:linear-gradient(90deg,#F26B7B,#FF9DA8)}
[data-theme=leve] .kpi:nth-child(1){background:#FFF9E6;border-color:#FFEDB8}[data-theme=leve] .kpi:nth-child(2){background:#EEFBF4;border-color:#CDF2DF}[data-theme=leve] .kpi:nth-child(3){background:#F0F5FF;border-color:#D7E3FF}
[data-theme=leve] .item.pinned{background:#FFFBEC}
[data-theme=leve] .cobrar{background:linear-gradient(135deg,#FFF8DC,#FFEFC9);border-color:#FFE19A}
/* ===== KITS COLORIDOS E WHATSAPP ===== */
.kcs{display:inline-flex;gap:4px;flex-wrap:nowrap;align-items:center}.kcs .sep{display:none}
.kc{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff;background:var(--kc);white-space:nowrap}
.kdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;background:var(--kc,#999)}
.qb{width:34px;height:34px;border-radius:50%;border:1px solid var(--ghostbd);background:var(--sf2);color:var(--ink);font-size:1.1rem;flex:none}.qb:disabled{opacity:.35}
.swt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.swt button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}.swt button.on{border-color:var(--ink)}
.cw{display:flex;align-items:center;gap:2px;padding:0 4px 0 10px;min-height:42px}.cw .wa{color:var(--grn);font-weight:700;text-decoration:none;white-space:nowrap;padding:8px 0}.cw .ed{background:none;border:0;padding:8px;opacity:.55;font-size:.9rem;width:auto;min-height:0}
/* ===== BOTOES DISCRETOS + GRADE DE ESCOLAS ===== */
.mini{position:fixed;right:26px;z-index:29;width:42px;height:42px;border-radius:50%;border:1px solid var(--ghostbd);background:var(--sf);color:var(--ink);font-size:1.05rem;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.18);opacity:.92}
.mini.m1{bottom:calc(154px + env(safe-area-inset-bottom,0px))}.mini.m2{bottom:calc(204px + env(safe-area-inset-bottom,0px))}
.igrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.icard{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.icard .icb{display:block;width:100%;text-align:left;color:inherit;background:none;border:0;padding:0}
.icard .icb .e{font-size:1.25rem;display:block;margin-bottom:4px}.icard .icb b{display:block;overflow-wrap:anywhere;line-height:1.25}
.icard .icb .tiny{display:block;margin-top:3px}
.icard .mv2{display:flex;gap:6px}.icard .mv2 button{flex:1;border:1px solid var(--ghostbd);background:var(--sf2);border-radius:10px;padding:7px 0;font-size:.9rem;color:var(--ink)}
.icard .mv2 button:disabled{opacity:.35}
.irow{position:relative}.pinb{position:absolute;right:34px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:transparent;font-size:1rem;opacity:.28;filter:grayscale(1)}
.pinb.on{opacity:1;filter:none;background:var(--evbg)}.item.pinned{border-color:var(--gold)}
/* ===== METAS ===== */
.bar{height:8px;border-radius:99px;background:var(--sf3);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .4s}
.bar.g i{background:var(--grn)}.bar.o i{background:var(--org)}.bar.r i{background:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi span{display:block;font-size:.72rem;color:var(--soft)}.kpi b{display:block;font-size:1.12rem;margin-top:2px;font-variant-numeric:tabular-nums}
@media (min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
.meta{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;color:inherit}
.meta .mh{display:flex;gap:10px;align-items:flex-start}.meta .mv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:10px 0 6px}.meta .mp{font-weight:800;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px dashed var(--ghostbd);background:var(--sf);border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:600}
/* ===== TAXAS ===== */
.cobrar{background:var(--evbg);border:1px solid var(--gold);border-radius:16px;padding:14px;text-align:center;margin:10px 0}
.cobrar span{font-size:.8rem;font-weight:700;color:var(--soft)}.cobrar b{display:block;font-size:2rem;line-height:1.15;margin:2px 0;font-variant-numeric:tabular-nums}.cobrar small{color:var(--soft)}
.ratebar{display:flex;align-items:center;gap:10px;margin-top:14px}
/* ===== LEITOR ===== */
.rdr{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rdr input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
.rdr input[type=text],.rdr input:not([type]){width:100%;background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.rdr .sub{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rdr .sub input{flex:1;min-width:120px}
.rdr.dup{opacity:.8}
/* ===== ÍCONES LUCIDE ===== */
.lu{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none;display:inline-block}
.back .lu,.theme .lu{width:20px;height:20px}
.fab .lu{width:26px;height:26px;stroke-width:2.4}
.mini .lu{width:20px;height:20px}
.item .e,.mi .e,.menu .mi .e,[data-theme=leve] .item .e,[data-theme=leve] .menu .mi .e{background:transparent!important}
.item .e .lu{width:24px;height:24px;color:var(--gold2)}
.task .ic .lu{width:20px;height:20px}
.lbl .lu{width:15px;height:15px;vertical-align:-.15em}
/* ===== BARRA INFERIOR (5 abas, ícones maiores) ===== */
.nav .in{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:.72rem;gap:3px;padding:6px 0}
.nav button .i{display:grid;place-items:center;font-size:1rem}
.nav button .i .lu{width:27px;height:27px;stroke-width:1.9}
.nav .bd{right:26%}
/* ===== ATALHOS DO INÍCIO ===== */
.menu{grid-template-columns:repeat(3,1fr)}
@media (min-width:700px){.menu{grid-template-columns:repeat(4,1fr)}}
.mi{align-items:center;justify-content:center;text-align:center;gap:4px;min-height:98px;padding:12px 6px;border-radius:16px}
.mi .e{color:var(--ic,var(--gold2));line-height:1}
.mi .e .lu{width:32px;height:32px;stroke-width:1.7}
.mi b{font-size:.84rem;line-height:1.2}
.mi>span:not(.e):not(.bd){display:none}
/* ===== CLIENTES ===== */
.nvgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.nvc{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:132px;color:inherit}
.nvc b{font-size:1.05rem}.nvi .lu{width:32px;height:32px;stroke-width:1.7;color:var(--gold2)}
.nvc:active{transform:scale(.98)}
.ckb{width:26px;height:26px;border-radius:8px;border:2px solid var(--ghostbd);background:var(--sf);display:grid;place-items:center;flex:none;color:#fff}.ckb.on{background:var(--grn);border-color:var(--grn)}.ckb .lu{width:16px;height:16px;stroke-width:3}
.feito{text-decoration:line-through;color:var(--faint)}
.wa2{display:inline-flex;align-items:center;gap:6px;color:var(--grn);font-weight:700;text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
/* ===== COMPUTADOR: aproveita a largura da tela ===== */
@media (min-width:900px){.app{max-width:980px}.app.wide{max-width:min(1680px,calc(100vw - 32px))}.nav .in{max-width:980px}.wrap{max-height:calc(100vh - 330px)}.kpis{grid-template-columns:repeat(3,1fr)}}
table.sh{min-width:100%}
@media (min-width:900px){.sh th{white-space:normal;line-height:1.15;padding:8px 8px;vertical-align:bottom}.sh td>button{padding:8px 8px}.sh td.c0>button{max-width:260px}.cw{padding-left:8px}}
/* ===== RODAPÉ: nome na mesma cor da logo ===== */
.foot,.foot b{color:#fff;text-shadow:0 0 1px rgba(0,0,0,.85),0 1px 3px rgba(0,0,0,.35)}
</style>
</head>

/* Fórmula de repasse: Valor_A_Cobrar = Valor_Desejado / (1 - Taxa_Decimal).
   O resultado é ajustado ao centavo: vale o menor valor cujo líquido, arredondado em centavos como a maquininha faz, não fica abaixo do desejado. */
function calcTaxa(desejado,pct){const t=(Number(pct)||0)/100;if(!(desejado>0)||t<0||t>=1)return null;const dc=Math.round(desejado*100),base=Math.round(desejado/(1-t)*100);let k=null;

  const r2=x=>Math.round(x*100)/100,cobrar=k/100;return{cobrar,desconto:r2(cobrar-desejado),pct:Number(pct),liquido:Math.round(k*(1-t))/100,recebeSem:r2(desejado*(1-t))};}

/* Aceita {provider,brands,updatedAt,unit,rates:{debit,credit,installments:{"2":..,"12":..}}} (chaves em português também). */
function normalizeRates(j,base){if(!j||typeof j!=="object")throw new Error("Resposta inválida");const R0=j.rates||j.taxas||j;
  const ins=R0.installments||R0.parcelado||R0.parcelas||{};const raw=[R0.debit??R0.debito,R0.credit??R0.credito];for(let k=2;k<=12;k++)raw.push(ins[k]??ins[k+"x"]);
  const nums=raw.map(v=>typeof v==="string"?parseFloat(v.replace(",",".")):Number(v));
  if(nums.some(n=>!isFinite(n)||n<=0))throw new Error("Resposta incompleta: faltam taxas");
  const dec=j.unit==="decimal"||(j.unit==null&&Math.max(...nums)<1);const pc=nums.map(n=>Math.round((dec?n*100:n)*10000)/10000);

    if(!r.ok)throw new Error("HTTP "+r.status);const nt=normalizeRates(await r.json(),base);

const ENVIO=[["Não enviado","r"],["Em andamento","o"],["Enviado","g"]];
function columns(t){let c;if(t.modelo==="mensal")c=[{k:"nome",n:"Aluno",t:"text",fix:1},{k:"contato",n:"Contato",t:"text"},...(t.meses||[]).map((m,i)=>({k:"m"+i,n:m,t:"mes",i})),{k:"soma",n:"Soma das parcelas",t:"soma"},{k:"pagto",n:"Status",t:"pagto"},{k:"obs",n:"Observações",t:"long"}];

    {k:"pago",n:"Pago",t:"money"},{k:"total",n:"Total a pagar",t:"money"},{k:"placa",n:"Foto da placa confirmada",t:"yesno"},{k:"obs",n:"Observações",t:"long"}];
  c=c.filter(x=>x.fix||!(t.hide||[]).includes(x.k));(t.cols||[]).forEach(x=>c.push({k:"x_"+x.id,n:x.nome,t:"x",c:x}));return c;}
function payStatus(t,a){if(!t)return{c:"r",l:"—",pago:0,total:0};let pago,total;
  if(t.modelo==="mensal"){pago=(t.meses||[]).reduce((s,m,i)=>s+(Number((a.mes||{})["m"+i])||0),0);total=(t.parcela||0)*(t.meses||[]).length;}else{pago=Number(a.pago)||0;total=Number(a.total)||0;}
  if(total>0&&pago>=total)return{c:"g",l:"Pago",pago,total};if(pago>0)return{c:"o",l:total?`Parcial · ${Math.round(pago/total*100)}%`:"Pagamento registrado",pago,total};return{c:"r",l:"Não pago",pago,total};}
function cellView(t,a,col){const v=k=>a[k];switch(col.t){
  case"text":if(col.k==="contato"){const f=fmtFone(v("contato"));return{h:f?esc(f):'<span class="muted">—</span>'};}return{h:esc(v(col.k)||"")||(col.k==="turmaTxt"?esc(t.nome):'<span class="muted">—</span>')};
  case"long":return{h:esc((v(col.k)||"").slice(0,40))+((v(col.k)||"").length>40?"…":"")||'<span class="muted">—</span>'};
  case"money":return{h:R(v(col.k)),m:1};
  case"kit":return{h:kitChips(a)};
  case"pagto":{const s=payStatus(t,a);return{h:s.l,c:s.c};}
  case"envio":{const e=ENVIO.find(x=>x[0]===a.envio)||ENVIO[0];return{h:e[0],c:e[1]};}
  case"yesno":return a[col.k]==="Sim"?{h:"Sim",c:"g"}:a[col.k]==="Não"?{h:"Não",c:"r"}:{h:'<span class="muted">—</span>'};
  case"mes":{const x=Number((a.mes||{})[col.k])||0,p=t.parcela||0;return{h:x?R(x):'<span>—</span>',m:1,c:!x?"r":p&&x<p?"o":"g"};}
  case"soma":return{h:R(payStatus(t,a).pago),m:1};
  case"x":{const c=col.c,x=(a.x||{})[c.id];if(c.tipo==="opcoes"){const o=(c.ops||[]).find(y=>y.t===x);return o?{h:esc(o.t),c:o.c!=="n"?o.c:""}:{h:'<span class="muted">—</span>'};}
    if(c.tipo==="simnao")return x==="Sim"?{h:"Sim",c:"g"}:x==="Não"?{h:"Não",c:"r"}:{h:'<span class="muted">—</span>'};if(c.tipo==="valor")return{h:R(x),m:1};if(c.tipo==="data")return{h:x?fdate(x):'<span class="muted">—</span>'};
    return{h:esc((x||"").slice(0,40))||'<span class="muted">—</span>'};}}return{h:""};}

function addAlunos(t){sheet(`<div class="grab"></div><h2>Adicionar alunos</h2><p class="small muted">Um nome por linha. Para incluir o contato, use “Nome; telefone”.</p>

function editCell(t,aid,k){const a=D.alunos.find(x=>x.id===aid);if(!a)return;const col=columns(t).find(c=>c.k===k)||{k,t:"text",n:k};const save=p=>B.update("alunos",aid,p);

    qa(".sheet [data-o]").forEach(b=>b.onclick=()=>{fn(b.dataset.o);closeSheet();});$("oClr").onclick=()=>{fn("");closeSheet();};};
  const text=(cur,long,fn)=>{sheet(head+`<label class="fld">${long?`<textarea id="cV" style="min-height:140px">${esc(cur||"")}</textarea>`:`<input id="cV" value="${esc(cur||"")}">`}</label><div class="btns"><button class="btn full" id="cS">Salvar</button></div>`);setTimeout(()=>$("cV").focus(),50);
    $("cS").onclick=()=>{fn($("cV").value);closeSheet();};$("cV").onkeydown=e=>{if(e.key==="Enter"&&!long){fn($("cV").value);closeSheet();}};};
  if(col.t==="text")return text(k==="contato"?fmtFone(a[k]):(a[k]||(k==="turmaTxt"?t.nome:"")),false,v=>save({[k]:k==="contato"?(fmtFone(v)||v.trim()):v.trim()}));
  if(col.t==="long")return text(a[k],true,v=>save({[k]:v}));
  if(col.t==="kit"){const ks=kits(),q={};kitIds(a).forEach(id=>{if(ks.some(x=>x.id===id))q[id]=(q[id]||0)+1;});const soma=()=>ks.reduce((s,x)=>s+(q[x.id]||0)*(Number(x.preco)||0),0),antes=soma();let upd=!a.total||!kitIds(a).length||Number(a.total)===antes;
    const draw=()=>{sheet(head+`<p class="tiny muted" style="margin:0 0 8px">Pode escolher mais de um kit. Toque em ＋ para adicionar (o mesmo kit pode repetir) e em − para tirar.</p>`+(ks.map(x=>{const n=q[x.id]||0;return `<div class="opt ${n?"on":""}" style="cursor:default"><span class="kdot" style="--kc:${corKit(x)}"></span><span class="grow">${esc(x.nome)}<br><span class="tiny muted">${R(x.preco)}</span></span><button class="qb" data-m="${x.id}" ${n?"":"disabled"} aria-label="Tirar">−</button><b style="min-width:22px;text-align:center">${n}</b><button class="qb" data-p="${x.id}" aria-label="Adicionar">＋</button></div>`;}).join("")||'<p class="empty">Nenhum kit cadastrado ainda.</p>')+
      `<div class="card small" style="margin-top:8px"><b>Soma dos kits: ${R(soma())}</b><label class="row" style="gap:8px;margin-top:6px"><input type="checkbox" id="kUp" ${upd?"checked":""} style="width:20px;height:20px"><span>Atualizar o total a pagar${a.total&&!upd?` (hoje: ${R(a.total)})`:""}</span></label></div><div class="btns"><button class="btn full" id="kOk">Salvar</button><button class="btn ghost full" id="kM">⚙️ Cadastrar e editar kits</button><button class="link" id="kC">Sem kit</button></div>`);
      const keep=()=>{if($("kUp"))upd=$("kUp").checked;};qa(".sheet [data-p]").forEach(b=>b.onclick=()=>{keep();q[b.dataset.p]=(q[b.dataset.p]||0)+1;draw();});qa(".sheet [data-m]").forEach(b=>b.onclick=()=>{keep();q[b.dataset.m]=Math.max(0,(q[b.dataset.m]||0)-1);draw();});
      $("kOk").onclick=()=>{keep();const ids=[];ks.forEach(x=>{for(let n=0;n<(q[x.id]||0);n++)ids.push(x.id);});const p={kits:ids,kit:ids[0]||""};if(upd)p.total=soma();save(p);closeSheet();};
      $("kM").onclick=kitsManager;$("kC").onclick=()=>{save({kits:[],kit:""});closeSheet();};};draw();return;}
  if(col.t==="envio")return opts(ENVIO,a.envio,v=>save({envio:v||"Não enviado"}));
  if(col.t==="yesno")return opts([["Sim","g"],["Não","r"]],a[k],v=>save({[k]:v}));
  if(col.t==="money"||col.t==="pagto")return payDialog(t,a);
  if(col.t==="mes"){const cur=(a.mes||{})[k]||"";sheet(head+`<label class="fld"><span>Valor pago nesta parcela (R$)</span><input id="cV" inputmode="decimal" value="${cur?String(cur).replace(".",","):""}"></label>
    <div class="btns">${t.parcela?`<button class="btn full" id="cF">Parcela completa · ${R(t.parcela)}</button>`:""}<button class="btn ghost full" id="cS">Salvar valor</button><button class="link" id="cZ">Zerar</button></div>`);setTimeout(()=>$("cV").focus(),50);
    const f=$("cF");if(f)f.onclick=()=>{save({mes:{[k]:t.parcela}});closeSheet();};$("cS").onclick=()=>{save({mes:{[k]:money($("cV").value)}});closeSheet();};$("cZ").onclick=()=>{save({mes:{[k]:0}});closeSheet();};return;}
  if(col.t==="x"){const c=col.c,cur=(a.x||{})[c.id];const sx=v=>save({x:{[c.id]:v}});
    if(c.tipo==="opcoes")return opts((c.ops||[]).map(o=>[o.t,o.c]),cur,sx);if(c.tipo==="simnao")return opts([["Sim","g"],["Não","r"]],cur,sx);
    if(c.tipo==="valor"){sheet(head+`<label class="fld"><input id="cV" inputmode="decimal" value="${cur?String(cur).replace(".",","):""}"></label><div class="btns"><button class="btn full" id="cS">Salvar</button></div>`);$("cS").onclick=()=>{sx(money($("cV").value));closeSheet();};return;}
    if(c.tipo==="data"){sheet(head+`<label class="fld"><input id="cV" type="date" value="${cur||""}"></label><div class="btns"><button class="btn full" id="cS">Salvar</button></div>`);$("cS").onclick=()=>{sx($("cV").value);closeSheet();};return;}
    return text(cur,true,sx);}}

function openRow(t,aid){const a=D.alunos.find(x=>x.id===aid);if(!a)return;const cols=columns(t);const wl=waLink(a.contato),tel=wl?wl.replace("https://wa.me/",""):"";

function colsManager(t){const base=t.modelo==="mensal"?[["contato","Contato"],["obs","Observações"]]:[["turmaTxt","Turma"],["contato","Contato"],["kit","Kit"],["pagto","Status de pagamento"],["envio","Envio das fotos"],["pago","Pago"],["total","Total a pagar"],["placa","Foto da placa confirmada"],["obs","Observações"]];

  ${base.map(([k,n])=>`<button class="opt" data-h="${k}"><span class="grow">${n}</span><span class="st ${hide.includes(k)?"n":"g"}">${hide.includes(k)?"Oculta":"Visível"}</span></button>`).join("")}

function colForm(t,cid){const c=cid?JSON.parse(JSON.stringify((t.cols||[]).find(x=>x.id===cid))):{id:nid(),nome:"",tipo:"texto",ops:[]};
  const draw=()=>{sheet(`<div class="grab"></div><h2>${cid?"Editar":"Nova"} coluna</h2><label class="fld"><span>Nome da coluna</span><input id="xN" maxlength="40" value="${esc(c.nome)}"></label>
   <div class="fld"><span>Tipo</span><div class="seg" id="xT">${[["texto","Texto livre"],["opcoes","Opções"],["simnao","Sim ou não"],["valor","Valor (R$)"],["data","Data"]].map(([v,l])=>`<button data-v="${v}" aria-pressed="${c.tipo===v}">${l}</button>`).join("")}</div></div>
   ${c.tipo==="opcoes"?`<div class="lbl">Opções e cores</div>${c.ops.map((o,i)=>`<div class="row" style="margin-bottom:6px"><input data-oi="${i}" value="${esc(o.t)}" style="flex:1;background:var(--sf2);border:1px solid var(--line);border-radius:10px;padding:9px"><div class="seg" data-oc="${i}">${["r","o","g","n"].map(k=>`<button data-v="${k}" aria-pressed="${o.c===k}" title="cor"><span class="dot ${k}"></span></button>`).join("")}</div><button class="back" data-od="${i}">✕</button></div>`).join("")}
   <button class="btn ghost sm" id="xAdd">＋ Opção</button>`:""}
   <div class="btns"><button class="btn full" id="xS">Salvar coluna</button>${cid?`<button class="btn ghost full" id="xD" style="color:var(--danger)">Remover coluna</button>`:""}</div>`);
   const sync=()=>{c.nome=$("xN").value;qa("[data-oi]").forEach(i=>c.ops[+i.dataset.oi].t=i.value);};
   $("xT").onclick=e=>{const b=e.target.closest("button");if(!b)return;sync();c.tipo=b.dataset.v;if(c.tipo==="opcoes"&&!c.ops.length)c.ops=[{t:"Não iniciado",c:"r"},{t:"Em andamento",c:"o"},{t:"Concluído",c:"g"}];draw();};
   qa("[data-oc]").forEach(s=>s.onclick=e=>{const b=e.target.closest("button");if(!b)return;sync();c.ops[+s.dataset.oc].c=b.dataset.v;draw();});
   qa("[data-od]").forEach(b=>b.onclick=()=>{sync();c.ops.splice(+b.dataset.od,1);draw();});const ad=$("xAdd");if(ad)ad.onclick=()=>{sync();c.ops.push({t:"",c:"n"});draw();};
   $("xS").onclick=()=>{sync();c.nome=c.nome.trim();if(!c.nome)return toast("⚠️","Dê um nome à coluna","");c.ops=(c.ops||[]).filter(o=>o.t.trim());const cols=(t.cols||[]).filter(x=>x.id!==c.id).concat(c);
     if(cid)cols.sort((a,b)=>(t.cols||[]).findIndex(x=>x.id===a.id)-(t.cols||[]).findIndex(x=>x.id===b.id));B.update("turmas",t.id,{cols});t.cols=cols;colsManager(t);};
   const d=$("xD");if(d)d.onclick=()=>{if(confirm("Remover esta coluna? Os valores dela deixam de aparecer.")){const cols=(t.cols||[]).filter(x=>x.id!==c.id);B.update("turmas",t.id,{cols});t.cols=cols;colsManager(t);}};};draw();}
function csv(t){const cols=columns(t),al=D.alunos.filter(a=>a.turma===t.id).sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt"));
  const txt=h=>String(h).replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  const rows=[cols.map(c=>c.n)].concat(al.map(a=>cols.map(c=>{if(c.t==="long")return a[c.k]||"";if(c.t==="x"&&(c.c.tipo==="texto"))return (a.x||{})[c.c.id]||"";return txt(cellView(t,a,c).h).replace("—","");})));
  const s="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));l.download=`${t.nome}.csv`;document.body.appendChild(l);l.click();l.remove();toast("⬇️","Planilha exportada","Abra no Excel ou no Google Planilhas.");}

    $("kCor").onclick=e=>{const b=e.target.closest("button");if(!b)return;k.cor=b.dataset.cor;qa("#kCor button").forEach(x=>x.classList.toggle("on",x===b));};$("kS2").onclick=async()=>{k.nome=$("kN2").value.trim()||k.nome;k.preco=money($("kP2").value);k.custo=money($("kC2").value);await saveK(ks);kitsManager();};$("kD2").onclick=async()=>{await saveK(ks.filter(x=>x.id!==k.id));kitsManager();};});}

function relData(ano){const ins=D.inst.filter(i=>ano==="todos"||instAno(i)===ano);let prev=0,pago=0,n=0,quit=0,parc=0,nada=0,prud=0;const por=[],pend=[];
  ins.forEach(i=>{let ip=0,it=0,ia=0;D.turmas.filter(t=>t.inst===i.id).forEach(t=>D.alunos.filter(a=>a.turma===t.id).forEach(a=>{const s=payStatus(t,a),tot=Number(s.total)||0,pg=Number(s.pago)||0;ia++;ip+=pg;pago+=pg;
    if(tot>0){n++;it+=tot;prev+=tot;if(pg>=tot)quit++;else if(pg>0)parc++;else nada++;const rec=Math.max(0,tot-pg);if(rec>0){pend.push({a,t,i,rec,pg,tot});if(pg>0)prud+=rec;}}}));if(ia)por.push({i,ip,it,ia});});
  const aRec=pend.reduce((s,x)=>s+x.rec,0);pend.sort((a,b)=>b.rec-a.rec);
  return{prev,pago,aRec,n,quit,parc,nada,prud,por,pend,inadV:prev?aRec/prev*100:0,inadA:n?(parc+nada)/n*100:0,proj:pago+prud};}

  <div class="lbl">${ic("chart-column")} Por ${"escola e faculdade"}</div><div class="card">${E.por.map(x=>{const p=pc(x.ip,x.it);return `<div style="margin-bottom:12px"><div class="row small"><b class="grow">${esc(x.i.nome)}</b><span>${R(x.ip)} <span class="muted">de ${R(x.it)}</span></span></div><div class="bar ${p>=100?"g":p>=50?"":"o"}" style="margin-top:5px"><i style="width:${Math.min(100,p)}%"></i></div><div class="tiny muted" style="margin-top:3px">${p}% recebido · falta ${R(Math.max(0,x.it-x.ip))}</div></div>`;}).join("")||'<p class="empty">Sem dados neste ano.</p>'}</div>

const MET={arrecadado:{n:"Arrecadação (R$)",ic:"💰",cat:"Financeiras",money:1,auto:1},lucro:{n:"Lucro aproximado (R$)",ic:"📈",cat:"Financeiras",money:1,auto:1},
 previsto:{n:"Receita prevista (R$ a receber no total)",ic:"🧾",cat:"Financeiras",money:1,auto:1},quitacao:{n:"% de alunos com pagamento quitado",ic:"✅",cat:"Financeiras",pct:1,auto:1},
 escolas:{n:"Nº de escolas",ic:"🏫",cat:"Crescimento",auto:1},faculdades:{n:"Nº de faculdades",ic:"🎓",cat:"Crescimento",auto:1},turmas:{n:"Nº de turmas",ic:"📋",cat:"Crescimento",auto:1},
 alunos:{n:"Nº de alunos cadastrados",ic:"👥",cat:"Crescimento",auto:1},manual:{n:"Meta personalizada (eu atualizo)",ic:"🎯",cat:"Outras"}};
const metasL=()=>((D.config.find(c=>c.id==="metas")||{}).lista)||[];
const saveMetas=l=>B.set("config","metas",{lista:l});
const dias=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
function empData(ano){const ins=D.inst.filter(i=>ano==="todos"||instAno(i)===ano),ids=new Set(ins.map(i=>i.id)),ts=D.turmas.filter(t=>ids.has(t.inst));let alunos=0,quit=0,pago=0,prev=0;
  ts.forEach(t=>{const s=stats(t.id);alunos+=s.n;quit+=s.g;pago+=s.pago;prev+=s.tot;});const lucro=lucroData(ano).reduce((s,x)=>s+x.atual,0);
  return{escolas:ins.filter(i=>i.tipo==="escola").length,faculdades:ins.filter(i=>i.tipo==="faculdade").length,turmas:ts.length,alunos,quitacao:alunos?quit/alunos*100:0,arrecadado:pago,previsto:prev,lucro};}
function fmtMeta(m,v){const T=MET[m.tipo]||MET.manual;v=Number(v)||0;if(T.money||(m.tipo==="manual"&&m.un==="R$"))return R(v);if(T.pct)return v.toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
  return Math.round(v*100)/100===Math.round(v)?String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,"."):v.toLocaleString("pt-BR",{maximumFractionDigits:2})+(m.tipo==="manual"&&m.un?" "+m.un:"");}
function metaCalc(m,E){const T=MET[m.tipo]||MET.manual,cur=T.auto?(E[m.tipo]||0):(Number(m.atual)||0),alvo=Number(m.alvo)||0,pct=alvo>0?Math.min(100,cur/alvo*100):0,falta=Math.max(0,alvo-cur),t=TODAY();
  const ini=m.inicio||iso(new Date(m.criado||Date.now())),d=m.prazo?dias(t,m.prazo):null,tot=m.prazo?dias(ini,m.prazo):null;let st="and",esp=null;
  if(alvo>0&&cur>=alvo)st="ok";else if(m.prazo){if(d<0)st="venc";else{esp=tot>0?alvo*Math.min(1,Math.max(0,dias(ini,t))/tot):alvo;st=cur>=esp*0.9?"ritmo":"risco";}}

      lines.sort((a,b)=>b.y-a.y).forEach(L=>{L.its.sort((a,b)=>a.x-b.x);const cells=[];let cur="",end=null;L.its.forEach(t=>{if(end!=null&&t.x-end>Math.max(8,t.h*1.3)){cells.push(cur);cur=t.s;}else cur+=(cur&&end!=null&&t.x-end>1?" ":"")+t.s;end=t.x+t.w;});if(cur.trim())cells.push(cur);out.push(cells);});}
    else{const vp0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(3,2200/vp0.width)}),cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      out.push(...await ocrCanvas(cv,(t,q)=>prog(`Página ${p} de ${N}: ${t}`,(p-1+q)/N)));}}return out;}
async function rowsDeArquivo(f,prog){const nm=(f.name||"").toLowerCase(),ty=f.type||"",base=(f.name||"").replace(/\.[a-z0-9]+$/i,"");
  if(/\.(xlsx|xls|ods|xlsm)$/.test(nm)){prog("Abrindo planilha…",.3);await loadLib(U_XL);const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""})})).filter(x=>x.rows.length);}
  if(/\.(csv|tsv|txt)$/.test(nm)||/text\//.test(ty)){prog("Lendo arquivo…",.3);const t=await f.text();return [{name:base,rows:/\.txt$/.test(nm)&&!/[;\t,]/.test(t.slice(0,300))?textoParaLinhas(t):parseCSVTxt(t)}];}
  if(/\.pdf$/.test(nm)||ty==="application/pdf")return [{name:base,rows:await rowsDePdf(f,prog)}];
  if(/^image\//.test(ty)||/\.(jpe?g|png|webp|heic|heif|bmp|gif)$/.test(nm)){prog("Ajustando a imagem…",.1);const cv=await prepararImagem(f);return [{name:base,rows:await ocrCanvas(cv,prog)}];}
  throw new Error("Tipo de arquivo não suportado: "+(f.name||""));}

let RD={};
function leitor(ctx){RD={ctx:ctx||{}};sheet(`<div class="grab"></div><h2>📷 Ler documento</h2><p class="small muted">Fotografe a lista ou anexe o arquivo. O G3 lê os nomes e monta a lista para você conferir antes de salvar. A leitura das fotos acontece no seu aparelho.</p>
  <div class="btns"><label class="btn full">📷 Tirar foto agora<input type="file" id="rdCam" accept="image/*" capture="environment" hidden></label>

  <label class="btn ghost full">📎 Anexar PDF, Excel ou CSV<input type="file" id="rdDoc" accept=".pdf,.xlsx,.xls,.ods,.csv,.tsv,.txt,application/pdf,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden></label></div>

  ["rdCam","rdImg","rdDoc"].forEach(id=>$(id).onchange=e=>{const fs=[...e.target.files];if(fs.length)lerArquivos(fs);});}
async function lerArquivos(fs){const prog=(t,p)=>{const el=$("rdP");if(!el)return;el.querySelector("span").textContent=t;el.querySelector(".bar i").style.width=Math.max(3,Math.round((p||0)*100))+"%";};
  sheet(`<div class="grab"></div><h2>Lendo documento…</h2><div id="rdP"><p class="small muted"><span>Preparando…</span></p><div class="bar"><i style="width:3%"></i></div></div><p class="tiny muted">Na primeira foto o app baixa o reconhecimento de texto (alguns segundos, com internet). Depois fica mais rápido.</p>`);
  let sheets=[];try{for(let i=0;i<fs.length;i++)sheets=sheets.concat(await rowsDeArquivo(fs[i],(t,p)=>prog((fs.length>1?`Arquivo ${i+1}/${fs.length} · `:"")+t,(i+(p||0))/fs.length)));}
  catch(e){console.warn(e);const off=/offline|Failed to fetch|NetworkError|Load failed/i.test((e&&e.message)||"");toast("⚠️","Não consegui ler o arquivo",off?"Conecte-se à internet para ler fotos e PDFs.":(e&&e.message)||"Tente outra foto ou arquivo.");return leitor(RD.ctx);}
  const res=interpretar(sheets,{arquivos:fs.map(f=>f.name).filter(Boolean).join(", ")});res.arquivos=fs.map(f=>f.name).filter(Boolean).join(", ");
  if(!res.groups.length){toast("🔍","Não encontrei nomes","Tente uma foto mais reta e nítida, ou um PDF/planilha.");return leitor(RD.ctx);}RD.dest=null;RD.groups=null;reviewLeitura(res);}
const turmaKey=n=>(turmaCore(n)||nrm(n)).toLowerCase();
function acharTurma(ts,g){const k=g.key||turmaKey(g.nome);let t=k?ts.find(x=>turmaKey(x.nome)===k):null;if(!t&&g.nome)t=ts.find(x=>nrm(x.nome)===nrm(g.nome));return t?t.id:"";}
function acharExistente(arr,nome){const n=nrm(nome);let a=arr.find(x=>nrm(x.nome)===n);if(a)return a;let best=null,bs=0.85;arr.forEach(x=>{const s=simNome(x.nome,nome);if(s>=bs){bs=s;best=x;}});return best;}
const kitNomes=t=>String(t||"").split(/\s*[+;|\/]\s*|\s*,\s*/).map(x=>x.trim()).filter(Boolean);
function kitsNovos(){const ks=new Set(kits().map(k=>nrm(k.nome))),m=new Map();
  RD.groups.forEach(g=>{if(!g.on)return;const t=g.turma?D.turmas.find(x=>x.id===g.turma):null;if((t?t.modelo:g.modelo)==="mensal")return;
    g.items.forEach(it=>{if(!it.on||it.dup||!it.kit)return;const ns=kitNomes(it.kit);ns.forEach(nm=>{const k=nrm(nm);if(!k||ks.has(k))return;const e=m.get(k)||{nome:tcase(nm),tot:[],n:0};e.n++;if(it.total&&ns.length===1)e.tot.push(it.total);m.set(k,e);});});});
  m.forEach(e=>{e.preco=e.tot.length?moda(e.tot):0;});return m;}
function reviewLeitura(res){const ctx=RD.ctx,tipo=ctx.tipo||"escola",ano=ctx.ano||curAno(),insts=D.inst.filter(i=>i.tipo===tipo&&instAno(i)===ano).sort(byName);
  const turmasDe=i=>D.turmas.filter(t=>t.inst===i).sort((a,b)=>a.nome.localeCompare(b.nome,"pt",{numeric:true}));
  if(!RD.dest){const inst=ctx.inst||(ctx.turma?"":guessInst(res,insts))||"";RD.dest={inst,newInst:res.escolaGuess||""};}
  RD.res=res;const d=RD.dest,instFix=ctx.inst||(ctx.turma?(D.turmas.find(x=>x.id===ctx.turma)||{}).inst:"")||"";
  if(!RD.groups){RD.groups=res.groups.map((g,gi)=>({gi,key:g.key,nome:g.nome,modelo:g.modelo,meses:g.meses,parcela:g.parcela,fontes:g.fontes,turma:"",novo:g.nome,on:true,open:res.groups.length===1,items:g.items.map(it=>Object.assign({on:true},it))}));
    if(ctx.turma){const t=D.turmas.find(x=>x.id===ctx.turma),k=t?turmaKey(t.nome):"";RD.groups.forEach(g=>{g.on=false;g.turma=ctx.turma;});const m=RD.groups.find(g=>g.key===k)||(RD.groups.length===1?RD.groups[0]:null);if(m)m.on=true;}
    else RD.groups.forEach(g=>{g.turma=acharTurma(turmasDe(d.inst),g);});RD.criarKits=true;}
  const sync=()=>{qa("[data-gon]").forEach(c=>{RD.groups[+c.dataset.gon].on=c.checked;});qa("[data-gnm]").forEach(i=>RD.groups[+i.dataset.gnm].novo=i.value);qa("[data-gdest]").forEach(s=>RD.groups[+s.dataset.gdest].turma=s.value);qa("[data-gd]").forEach(x=>RD.groups[+x.dataset.gd].open=x.open);
    qa("[data-ck]").forEach(c=>{const [g,i]=c.dataset.ck.split(":");RD.groups[+g].items[+i].on=c.checked;});qa("[data-nm]").forEach(c=>{const [g,i]=c.dataset.nm.split(":");RD.groups[+g].items[+i].nome=c.value;});qa("[data-ct]").forEach(c=>{const [g,i]=c.dataset.ct.split(":");RD.groups[+g].items[+i].contato=fmtFone(c.value)||c.value.trim();});
    if($("rdI"))d.inst=$("rdI").value;if($("rdNI"))d.newInst=$("rdNI").value;if($("rdKit"))RD.criarKits=$("rdKit").checked;};
  const draw=()=>{const ts=turmasDe(instFix||d.inst);let nN=0,nU=0,nG=0;
    RD.groups.forEach(g=>{const tur=g.turma?D.turmas.find(t=>t.id===g.turma):null,ex=tur?D.alunos.filter(a=>a.turma===tur.id):[];g.tur=tur;g.model=tur?tur.modelo:g.modelo;
      g.items.forEach(it=>{const e=ex.length?acharExistente(ex,it.nome):null,nd=e?e.id:"";if(it._d===undefined||it._d!==!!nd)it.on=!nd;it._d=!!nd;it.dup=nd;});
      if(g.on){nG++;g.items.forEach(it=>{if(it.on){if(it.dup)nU++;else nN++;}});}});
    const kn=kitsNovos(),tot=RD.groups.reduce((a,g)=>a+g.items.length,0);
    const itRow=(g,i,it)=>`<div class="rdr ${it.dup?"dup":""}"><input type="checkbox" data-ck="${g.gi}:${i}" ${it.on?"checked":""} aria-label="Incluir"><input type="text" data-nm="${g.gi}:${i}" value="${esc(it.nome)}" aria-label="Nome">
      <div class="sub"><input type="text" data-ct="${g.gi}:${i}" value="${esc(it.contato)}" placeholder="contato" inputmode="tel">${it.dup?'<span class="st o">já existe · marque p/ atualizar</span>':""}${it.kit?`<span class="st n">${esc(it.kit)}</span>`:""}${it.total?`<span class="st n">${R(it.total)}</span>`:""}${it.pago?`<span class="st g">pago ${R(it.pago)}</span>`:""}${Object.keys(it.mes||{}).length?`<span class="st g">${Object.keys(it.mes).length} mês(es)</span>`:""}${(it.srcs||[]).length>1?`<span class="st n">${esc(it.srcs.join(" + "))}</span>`:""}</div></div>`;
    sheet(`<div class="grab"></div><h2>Conferir o que foi lido</h2><p class="small muted" style="margin:0 0 8px">${RD.groups.length} turma(s) · ${tot} aluno(s)${res.arquivos?" · "+esc(res.arquivos):""}. Cada turma vai separada. Corrija o que precisar antes de salvar.</p>
     ${res.ignoradas.length?`<p class="tiny muted" style="margin:0 0 8px">Abas ignoradas: ${res.ignoradas.map(x=>esc(x.name)+" ("+x.motivo+")").join(", ")}.</p>`:""}
     ${instFix?"":`<label class="fld"><span>${tipo==="escola"?"Escola":"Faculdade"}</span><select id="rdI">${insts.map(i=>`<option value="${i.id}" ${i.id===d.inst?"selected":""}>${esc(i.nome)}</option>`).join("")}<option value="" ${!d.inst?"selected":""}>＋ Nova ${tipo==="escola"?"escola":"faculdade"}</option></select></label>${d.inst?"":`<label class="fld"><span>Nome da nova ${tipo==="escola"?"escola":"faculdade"}</span><input id="rdNI" maxlength="80" value="${esc(d.newInst)}"></label>`}`}
     ${ctx.turma&&RD.groups.length>1?`<p class="small" style="color:var(--org)">Este arquivo tem várias turmas. Marque a que vai nesta turma.</p>`:""}
     ${RD.groups.map(g=>`<div class="card" style="margin:8px 0;padding:10px"><label class="row" style="gap:8px"><input type="checkbox" data-gon="${g.gi}" ${g.on?"checked":""} style="width:22px;height:22px;accent-color:var(--gold)"><b class="grow">${esc((g.tur?g.tur.nome:g.novo)||"Turma sem nome")}</b><span class="st n">${g.items.length} aluno(s)</span></label>
       <div class="tiny muted" style="margin:3px 0 6px 30px">${g.model==="mensal"?"Mensalidades"+(g.meses.length?" · "+g.meses.length+" meses":""):"Formatura e kits"}${g.fontes.length>1?" · de "+esc(g.fontes.join(" + ")):""}</div>
       ${ctx.turma?"":`<label class="fld" style="margin:0 0 6px"><span>Vai para</span><select data-gdest="${g.gi}">${ts.map(t=>`<option value="${t.id}" ${t.id===g.turma?"selected":""}>${esc(t.nome)}</option>`).join("")}<option value="" ${!g.turma?"selected":""}>＋ Nova turma</option></select></label>
       ${g.turma?"":`<label class="fld" style="margin:0 0 6px"><span>Nome da turma</span><input data-gnm="${g.gi}" maxlength="40" value="${esc(g.novo)}" placeholder="Ex.: Turma 3A"></label><div class="seg" data-gmod="${g.gi}" style="margin-bottom:6px"><button data-v="formatura" aria-pressed="${g.modelo==="formatura"}">Formatura e kits</button><button data-v="mensal" aria-pressed="${g.modelo==="mensal"}">Mensalidades</button></div>`}`}
       <details data-gd="${g.gi}" ${g.open?"open":""}><summary class="small" style="cursor:pointer">Ver e editar alunos</summary>${g.items.map((it,i)=>itRow(g,i,it)).join("")}</details></div>`).join("")}
     ${kn.size?`<div class="card" style="margin:8px 0;padding:10px"><label class="row" style="gap:8px"><input type="checkbox" id="rdKit" ${RD.criarKits?"checked":""} style="width:22px;height:22px;accent-color:var(--gold)"><span class="grow small"><b>Cadastrar kits novos</b><br><span class="tiny muted">${[...kn.values()].map(k=>`${esc(k.nome)} (${k.preco?R(k.preco):"sem preço"} · ${k.n})`).join(" · ")}. O custo fica em branco, ajuste em Kits. Desmarcado, o nome do kit vai para as observações.</span></span></label></div>`:""}
     <div class="btns" style="position:sticky;bottom:0;background:var(--sf);padding-top:8px"><button class="btn full" id="rdGo" ${nN+nU?"":"disabled"}>${nN+nU?`${nN?`Adicionar ${nN} aluno(s)`:""}${nN&&nU?" e ":""}${nU?`${nN?"atualizar":"Atualizar"} ${nU}`:""} · ${nG} turma(s)`:"Nenhum aluno marcado"}</button><button class="btn ghost full" id="rdBack">Ler outro arquivo</button></div>`);

    if(g("rdI"))g("rdI").onchange=()=>{sync();RD.groups.forEach(x=>{x.turma=acharTurma(turmasDe(d.inst),x);});draw();};
    qa("[data-gdest]").forEach(s=>s.onchange=re);qa("[data-gmod]").forEach(sg=>sg.onclick=e=>{const b=e.target.closest("button");if(!b)return;sync();RD.groups[+sg.dataset.gmod].modelo=b.dataset.v;draw();});
    qa("[data-gon]").forEach(c=>c.onchange=()=>{sync();if(ctx.turma&&c.checked)RD.groups.forEach(x=>{if(x.gi!==+c.dataset.gon)x.on=false;});draw();});
    qa("[data-ck]").forEach(c=>c.onchange=()=>{sync();draw();});if(g("rdKit"))g("rdKit").onchange=()=>{sync();};
    $("rdBack").onclick=()=>{RD.groups=null;RD.dest=null;leitor(ctx);};$("rdGo").onclick=()=>{sync();salvarLeitura();};};draw();}
async function salvarLeitura(){const ctx=RD.ctx,d=RD.dest,tipo=ctx.tipo||"escola",ano=ctx.ano||curAno();const btn=$("rdGo");if(btn)btn.disabled=true;const volta=()=>{if(btn)btn.disabled=false;};
  try{const gs=RD.groups.filter(g=>g.on&&g.items.some(i=>i.on));if(!gs.length){volta();return toast("⚠️","Nenhum aluno marcado","");}
    for(const g of gs)if(!g.turma&&!(g.novo||"").trim()){volta();return toast("⚠️","Dê um nome à turma","Falta o nome em uma das turmas marcadas.");}
    let inst=ctx.inst||(ctx.turma?(D.turmas.find(x=>x.id===ctx.turma)||{}).inst:"")||d.inst;
    if(!inst){const nm=(d.newInst||"").trim();if(!nm){volta();return toast("⚠️","Dê um nome à "+(tipo==="escola"?"escola":"faculdade"),"");}inst=await B.add("inst",Object.assign({nome:nm,tipo,ano,cidade:"",autor:UID,criado:Date.now()},tipo==="escola"&&ctx.nivel&&ctx.nivel!=="sem"?{nivel:ctx.nivel}:{}));}
    const kmap=new Map(kits().map(k=>[nrm(k.nome),k]));
    if(RD.criarKits){const kn=kitsNovos();if(kn.size){let ks=kitsComCor(kits().slice());kn.forEach((v,k)=>{ks=kitsComCor(ks.concat([{id:nid(),nome:v.nome,preco:v.preco||0,custo:0}]));});ks.forEach(k=>kmap.set(nrm(k.nome),k));await saveKitsList(ks);}}
    const nomeMes=m=>{const i=mesIdx(m);return i>=0?MES[i].charAt(0).toUpperCase()+MES[i].slice(1):m;};let nA=0,nU=0,nT=0,last=null;
    for(const g of gs){let t=g.turma?D.turmas.find(x=>x.id===g.turma):null;
      if(!t){const tv={nome:g.novo.trim(),inst,modelo:g.modelo,cols:[],hide:[],criado:Date.now(),autor:UID};if(g.modelo==="mensal"){tv.meses=(g.meses.length?g.meses:MESES_PAD.split(", ")).map(nomeMes);tv.parcela=g.parcela||0;tv.custoAluno=0;}
        const id=await B.add("turmas",tv);t=Object.assign({id},tv);nT++;}
      last=t;const ex=new Set(D.alunos.filter(a=>a.turma===t.id).map(a=>nrm(a.nome)));
      for(const it of g.items){if(!it.on)continue;const nome=limparNome(it.nome)||it.nome.trim();if(!nome)continue;const extra={};let obs=it.obs||"";
        if(it.contato&&it.contato.trim())extra.contato=fmtFone(it.contato)||it.contato.trim();
        if(t.modelo==="mensal"){const mm={};(t.meses||[]).forEach((m,i)=>{const v=it.mes[nrm(m)]||it.mes[nrm(m).slice(0,3)];if(v)mm["m"+i]=v;});if(Object.keys(mm).length)extra.mes=mm;if(it.kit)obs=(obs?obs+" · ":"")+"Kit: "+it.kit;}
        else{if(it.pago)extra.pago=it.pago;const ns=kitNomes(it.kit),ach=ns.map(nm=>kmap.get(nrm(nm))).filter(Boolean),falt=ns.filter(nm=>!kmap.get(nrm(nm)));if(ach.length){extra.kits=ach.map(k=>k.id);extra.kit=ach[0].id;extra.total=it.total||ach.reduce((s,k)=>s+(Number(k.preco)||0),0);}else if(it.total)extra.total=it.total;if(falt.length)obs=(obs?obs+" · ":"")+"Kit: "+falt.join(" + ");}
        if(obs)extra.obs=obs;
        if(it.dup){if(Object.keys(extra).length){await B.update("alunos",it.dup,extra);nU++;}}
        else if(!ex.has(nrm(nome))){const v={turma:t.id,nome,contato:"",criado:Date.now(),autor:UID};if(t.modelo!=="mensal")Object.assign(v,{pago:0,total:0,envio:"Não enviado",placa:"",obs:"",kit:"",kits:[]});else Object.assign(v,{mes:{},obs:""});await B.add("alunos",Object.assign(v,extra));nA++;ex.add(nrm(nome));}}}
    closeSheet();RD={};toast("✅",`${nA} aluno(s) adicionado(s)${nU?` · ${nU} atualizado(s)`:""}`,nT?`${nT} turma(s) criada(s)`:`Turma ${last.nome}`);
    if(!ctx.turma){if(gs.length===1&&last)go({v:"turma",id:last.id,t:tipo});else go({v:"instd",id:inst,t:tipo});}}
  catch(e){console.warn(e);volta();toast("⚠️","Não foi possível salvar",(e&&e.message)||"Tente de novo.");}}
