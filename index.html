<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G3 Formatura</title>
<meta name="description" content="G3 Formatura: agenda, planilhas das escolas e faculdades, notas e missões da equipe. Produzido por Flávio S. Praciano.">
<meta name="theme-color" content="#09090A">
<meta name="g3-version" content="1.0.0">
<link rel="manifest" href="g3-app-v1.webmanifest">
<link rel="icon" type="image/png" href="g3-icon-192.png">
<link rel="apple-touch-icon" href="g3-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="G3">
<style>
:root{--bg:#09090A;--sf:#141416;--sf2:#1C1C20;--sf3:#25252A;--line:#2C2C31;--ink:#F4F1E8;--soft:#A8A397;--faint:#76726A;--gold:#D9B04C;--gold2:#F2D27A;--goldd:#9C7A25;
--red:#E5484D;--reds:#3A1618;--org:#F2994A;--orgs:#3B2513;--grn:#2EB872;--grns:#12301F;--blue:#5B8CF6;--r:16px;color-scheme:dark;
--disp:Georgia,"Times New Roman",serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hidden{display:none!important}
.app{max-width:760px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;margin:0 -14px;background:rgba(9,9,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font:700 1.08rem var(--body);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:var(--sf2);border:1px solid var(--line);width:38px;height:38px;border-radius:12px;font-size:1.2rem;flex:none}
.ava{width:34px;height:34px;border-radius:10px;object-fit:cover;background:var(--sf3);flex:none;border:1px solid var(--line)}
.ava.lg{width:72px;height:72px;border-radius:18px}.ava.xl{width:180px;height:180px;border-radius:24px}
.logo{width:40px;height:40px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1A1405}
.btn.ghost{background:var(--sf2);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:11px}.btn.full{width:100%}.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--gold2);font-weight:700;padding:6px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lbl{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.muted{color:var(--soft)}.small{font-size:.88rem}.tiny{font-size:.76rem}
.fld{display:block;margin:10px 0}.fld span{display:block;font-size:.8rem;font-weight:700;color:var(--soft);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.fld textarea{min-height:90px;resize:vertical}.cnt{font-size:.74rem;color:var(--faint);text-align:right;margin-top:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--line);background:var(--sf2);border-radius:10px;padding:7px 11px;font-weight:700;font-size:.86rem}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(217,176,76,.15);color:var(--gold2)}
/* status */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.76rem;white-space:nowrap}
.st.r{background:var(--reds);color:#FF8A8D}.st.o{background:var(--orgs);color:#FFB777}.st.g{background:var(--grns);color:#5EE09A}.st.n{background:var(--sf3);color:var(--soft)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
/* home */
.hero{margin-top:14px;border-radius:22px;padding:18px;background:radial-gradient(420px 220px at 100% 0%,rgba(242,210,122,.22),transparent 70%),linear-gradient(160deg,#17150F,#0B0B0C);border:1px solid #3A3220}
.hero h2{font:700 1.5rem/1.15 var(--disp);margin:6px 0 0}.hero .q{margin:14px 0 0;font:italic 1.02rem/1.45 var(--disp);color:#EDE3C4}.hero .a{font-size:.82rem;color:var(--gold);margin-top:6px;font-weight:700}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:104px;position:relative}
.mi .e{font-size:1.5rem}.mi b{font-size:.98rem}.mi span{font-size:.78rem;color:var(--soft)}
.mi .bd{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 7px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.task .ic{font-size:1.15rem;width:24px;text-align:center}
.empty{color:var(--faint);font-size:.88rem;padding:6px 0}
/* listas */
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item .e{font-size:1.35rem;width:34px;height:34px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;flex:none}
.item b{display:block}.item .chev{color:var(--faint);font-size:1.2rem}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem;margin:12px 0 4px}.crumbs button{background:none;border:0;color:var(--gold2);padding:2px 4px;font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:18px;border:0;font-size:1.6rem;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1A1405;box-shadow:0 10px 24px rgba(0,0,0,.5)}
/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(14,14,16,.97);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.68rem;font-weight:700;color:var(--faint);padding:4px 0;position:relative}
.nav button .i{font-size:1.25rem}.nav button[aria-current="true"]{color:var(--gold2)}
.nav .bd{position:absolute;top:0;right:22%;background:var(--red);color:#fff;border-radius:99px;font-size:.62rem;padding:0 5px}
/* folha (modal) */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--sf);border:1px solid var(--line);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}.sheet h2{font:700 1.2rem var(--body);margin:0 0 6px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:.7rem;color:var(--faint);text-align:center;font-weight:800}
.cal button{aspect-ratio:1;border:1px solid transparent;background:var(--sf);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.9rem;padding:0}
.cal button.out{opacity:.3}.cal button.td{border-color:var(--gold)}.cal button.sel{background:var(--gold);color:#1A1405}
.cal .dots{display:flex;gap:2px;height:5px}.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--gold2)}.cal button.sel .dots i{background:#1A1405}
.ev{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ev .t{font-weight:800;font-size:.86rem;color:var(--gold2);min-width:46px}
/* planilha */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.sum div:last-child{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sum div:last-child b{display:flex;gap:6px}
.sum div{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.sum b{display:block;font-size:1.05rem}.sum span{font-size:.72rem;color:var(--soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tools input{flex:1;min-width:140px;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:68vh;background:var(--sf)}
table.sh{border-collapse:separate;border-spacing:0;font-size:.86rem;min-width:100%}
.sh th{position:sticky;top:0;z-index:2;background:#2A2416;color:var(--gold2);font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:9px 10px;white-space:nowrap;border-bottom:1px solid #4A3E20}
.sh td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid #1F1F23;white-space:nowrap}
.sh td>button{display:block;width:100%;min-height:42px;text-align:left;background:none;border:0;padding:8px 10px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.sh tr:nth-child(even) td{background:#17171A}
.sh .c0{position:sticky;left:0;z-index:1;background:var(--sf)!important;font-weight:700;box-shadow:2px 0 0 var(--line)}.sh td.c0>button{max-width:150px;white-space:normal;line-height:1.25}@media (min-width:600px){.sh td.c0>button{max-width:240px}}.sh th.c0{z-index:3;background:#2A2416!important}
.sh td.r>button{background:rgba(229,72,77,.13);color:#FF9A9C}.sh td.o>button{background:rgba(242,153,74,.15);color:#FFC48F}.sh td.g>button{background:rgba(46,184,114,.14);color:#6BE6A4}
.money{font-variant-numeric:tabular-nums;text-align:right!important}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px;font-weight:700}
.opt.on{border-color:var(--gold)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.dot.r{background:var(--red)}.dot.o{background:var(--org)}.dot.g{background:var(--grn)}.dot.n{background:var(--faint)}
/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(30px + env(safe-area-inset-top,0px)) 18px 30px;background:radial-gradient(500px 300px at 50% 0%,rgba(242,210,122,.16),transparent 70%),var(--bg)}
.auth .box{width:100%;max-width:420px}.auth h1{font:700 1.7rem var(--disp);text-align:center;margin:12px 0 2px}
.photo-pick{display:flex;align-items:center;gap:12px}.photo-pick img{width:84px;height:84px;border-radius:18px;object-fit:cover;background:var(--sf3);border:1px solid var(--line)}
.demo{background:#2B230F;border:1px solid #5A4718;color:#F2D27A;border-radius:12px;padding:10px 12px;font-size:.82rem;margin-top:12px}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:#1E1B12;border:1px solid #5A4718;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .25s}
.toast .e{font-size:1.3rem}.toast b{display:block}.toast span{font-size:.82rem;color:var(--soft)}
.foot{text-align:center;color:var(--faint);font-size:.76rem;margin:26px 0 0}
@media (min-width:700px){.menu{grid-template-columns:repeat(3,1fr)}}

</style>
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="main" class="hidden"><div class="app" id="view"></div></div>
<nav class="nav hidden" id="nav" aria-label="Navegação"><div class="in" id="navIn"></div></nav>
<div id="sheet" class="sheet hidden"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
const LOGO="g3-logo.png";
"use strict";
/* ================= UTILIDADES ================= */
const $=id=>document.getElementById(id),qa=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const iso=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const TODAY=()=>iso();
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);};
const fdate=s=>{if(!s)return"";const [y,m,d]=s.split("-");return `${d}/${m}/${y}`;};
const WD=["dom","seg","ter","qua","qui","sex","sáb"],MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const flong=s=>{const d=new Date(s+"T12:00:00");return `${WD[d.getDay()]}, ${d.getDate()} de ${MES[d.getMonth()]}`;};
const R=v=>"R$ "+(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function money(s){s=String(s==null?"":s).trim().replace(/\s|R\$/g,"");if(!s)return 0;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");const v=parseFloat(s);return isFinite(v)?Math.round(v*100)/100:0;}
const ago=t=>{const m=Math.round((Date.now()-t)/60000);if(m<1)return"agora";if(m<60)return m+" min";const h=Math.round(m/60);if(h<24)return h+" h";return fdate(iso(new Date(t)));};
const AUTHOR="Flávio S. Praciano";
const CFG=window.G3_CONFIG||{};
const DEMO=!(CFG.firebase&&CFG.firebase.apiKey&&!/COLE/i.test(CFG.firebase.apiKey)&&window.firebase);
const COLS=["users","events","folders","notes","inst","turmas","alunos","missoes","config"];
/* ================= FRASES ================= */
const FRASES=[["Tudo no mundo começou com um sim.","Clarice Lispector"],["O que vale na vida não é o ponto de partida e sim a caminhada. Caminhando e semeando, no fim terás o que colher.","Cora Coralina"],
["Feliz aquele que transfere o que sabe e aprende o que ensina.","Cora Coralina"],["Recria tua vida, sempre, sempre. Remove pedras e planta roseiras e faz doces. Recomeça.","Cora Coralina"],
["Educação não transforma o mundo. Educação muda as pessoas. Pessoas transformam o mundo.","Paulo Freire"],["Ninguém ignora tudo. Ninguém sabe tudo. Todos nós sabemos alguma coisa. Todos nós ignoramos alguma coisa. Por isso aprendemos sempre.","Paulo Freire"],
["O correr da vida embrulha tudo. A vida é assim: esquenta e esfria, aperta e daí afrouxa, sossega e depois desinquieta. O que ela quer da gente é coragem.","Guimarães Rosa"],
["Quem elegeu a busca não pode recusar a travessia.","Guimarães Rosa"],["Mestre não é quem sempre ensina, mas quem de repente aprende.","Guimarães Rosa"],
["Todos esses que aí estão atravancando meu caminho, eles passarão… Eu passarinho!","Mario Quintana"],["Se as coisas são inatingíveis… ora! Não é motivo para não querê-las. Que tristes os caminhos, se não fora a presença distante das estrelas!","Mario Quintana"],
["Aprendi com as primaveras a me deixar cortar e voltar sempre inteira.","Cecília Meireles"],["Sonho que se sonha só é só um sonho que se sonha só, mas sonho que se sonha junto é realidade.","Raul Seixas"],
["A vida é a arte do encontro, embora haja tanto desencontro pela vida.","Vinicius de Moraes"],["O otimista é um tolo. O pessimista, um chato. Bom mesmo é ser um realista esperançoso.","Ariano Suassuna"],
["Ostra feliz não faz pérola.","Rubem Alves"],["Faça o teu melhor, na condição que você tem, enquanto você não tem condições melhores, para fazer melhor ainda.","Mario Sergio Cortella"],
["Se você quer ser bem-sucedido, precisa ter dedicação total, buscar seu último limite e dar o melhor de si.","Ayrton Senna"]];
function frase(){let k=+localStorage.getItem("g3_q")||0;k=(k+1+Math.floor(Math.random()*3))%FRASES.length;localStorage.setItem("g3_q",k);return FRASES[k];}
/* ================= BACKEND ================= */
function LocalBackend(){const K="g3_demo_v1";const load=()=>{const s=JSON.parse(localStorage.getItem(K)||"null")||{auth:{},data:{}};COLS.forEach(c=>s.data[c]=s.data[c]||{});return s;};let st=load();
  const subs={};let authCb=null;
  const save=()=>{localStorage.setItem(K,JSON.stringify(st));};
  const emit=c=>(subs[c]||[]).forEach(f=>f(Object.entries(st.data[c]).map(([id,v])=>Object.assign({id},v))));
  window.addEventListener("storage",e=>{if(e.key===K){st=load();COLS.forEach(emit);}});
  const sess=()=>sessionStorage.getItem("g3_sess")||localStorage.getItem("g3_sess_last");
  return{demo:true,onAuth(cb){authCb=cb;const u=sess();cb(u?{uid:u}:null);},
    async signUp(e,p){e=e.toLowerCase().trim();st=load();if(st.auth[e])throw{code:"auth/email-already-in-use"};const u=nid();st.auth[e]={p,u};save();sessionStorage.setItem("g3_sess",u);localStorage.setItem("g3_sess_last",u);return u;},
    async signIn(e,p){st=load();const a=st.auth[e.toLowerCase().trim()];if(!a||a.p!==p)throw{code:"auth/invalid-credential"};sessionStorage.setItem("g3_sess",a.u);localStorage.setItem("g3_sess_last",a.u);authCb&&authCb({uid:a.u});},
    async signOut(){sessionStorage.removeItem("g3_sess");localStorage.removeItem("g3_sess_last");authCb&&authCb(null);},
    async reset(){throw{code:"demo"};},
    async get(c,id){st=load();const v=st.data[c][id];return v?Object.assign({id},v):null;},
    listen(c,cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>emit(c));},
    async set(c,id,v){st=load();st.data[c][id]=JSON.parse(JSON.stringify(v));save();emit(c);},
    async update(c,id,p){st=load();const o=st.data[c][id]||{};for(const k in p){if(p[k]&&typeof p[k]==="object"&&!Array.isArray(p[k])&&o[k]&&typeof o[k]==="object")o[k]=Object.assign({},o[k],p[k]);else o[k]=p[k];}st.data[c][id]=JSON.parse(JSON.stringify(o));save();emit(c);},
    async add(c,v){const id=nid();await this.set(c,id,v);return id;},
    async del(c,id){st=load();delete st.data[c][id];save();emit(c);}};}
function FireBackend(){firebase.initializeApp(CFG.firebase);const auth=firebase.auth(),db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
  return{demo:false,onAuth(cb){auth.onAuthStateChanged(u=>cb(u?{uid:u.uid}:null));},
    async signUp(e,p){const r=await auth.createUserWithEmailAndPassword(e.trim(),p);return r.user.uid;},
    async signIn(e,p){await auth.signInWithEmailAndPassword(e.trim(),p);},
    async signOut(){await auth.signOut();},async reset(e){await auth.sendPasswordResetEmail(e.trim());},
    async get(c,id){const d=await db.collection(c).doc(id).get();return d.exists?Object.assign({id:d.id},d.data()):null;},
    listen(c,cb){return db.collection(c).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),e=>toast("⚠️","Falha na sincronização",e.message));},
    set:(c,id,v)=>db.collection(c).doc(id).set(v),update:(c,id,p)=>db.collection(c).doc(id).set(p,{merge:true}),
    add:async(c,v)=>(await db.collection(c).add(v)).id,del:(c,id)=>db.collection(c).doc(id).delete()};}
const B=DEMO?LocalBackend():FireBackend();
/* ================= ESTADO ================= */

function turmaForm(id,inst){const t=id?D.turmas.find(x=>x.id===id):{inst,modelo:"formatura",meses:MESES_PAD.split(", "),parcela:0};let mod=t.modelo;

   :`<p class="tiny muted">Colunas: turma, nome, contato, kit, status de pagamento, envio das fotos, pago, total, foto da placa e observações. Você pode adicionar ou ocultar colunas depois.</p>`}

const ENVIO=[["Não enviado","r"],["Em andamento","o"],["Enviado","g"]];
function columns(t){let c;if(t.modelo==="mensal")c=[{k:"nome",n:"Aluno",t:"text",fix:1},...(t.meses||[]).map((m,i)=>({k:"m"+i,n:m,t:"mes",i})),{k:"soma",n:"Soma das parcelas",t:"soma"},{k:"pagto",n:"Status",t:"pagto"},{k:"obs",n:"Observações",t:"long"}];
  else c=[{k:"turmaTxt",n:"Turma",t:"text"},{k:"nome",n:"Nome completo",t:"text",fix:1},{k:"contato",n:"Contato",t:"text"},{k:"kit",n:"Kit",t:"kit"},{k:"pagto",n:"Status de pagamento",t:"pagto"},{k:"envio",n:"Envio das fotos",t:"envio"},
    {k:"pago",n:"Pago",t:"money"},{k:"total",n:"Total a pagar",t:"money"},{k:"placa",n:"Foto da placa confirmada",t:"yesno"},{k:"obs",n:"Observações",t:"long"}];
  c=c.filter(x=>x.fix||!(t.hide||[]).includes(x.k));(t.cols||[]).forEach(x=>c.push({k:"x_"+x.id,n:x.nome,t:"x",c:x}));return c;}
function payStatus(t,a){if(!t)return{c:"r",l:"—",pago:0,total:0};let pago,total;
  if(t.modelo==="mensal"){pago=(t.meses||[]).reduce((s,m,i)=>s+(Number((a.mes||{})["m"+i])||0),0);total=(t.parcela||0)*(t.meses||[]).length;}else{pago=Number(a.pago)||0;total=Number(a.total)||0;}
  if(total>0&&pago>=total)return{c:"g",l:"Pago",pago,total};if(pago>0)return{c:"o",l:total?`Parcial · ${Math.round(pago/total*100)}%`:"Pagamento registrado",pago,total};return{c:"r",l:"Não pago",pago,total};}
function cellView(t,a,col){const v=k=>a[k];switch(col.t){
  case"text":return{h:esc(v(col.k)||"")||(col.k==="turmaTxt"?esc(t.nome):'<span class="muted">—</span>')};
  case"long":return{h:esc((v(col.k)||"").slice(0,40))+((v(col.k)||"").length>40?"…":"")||'<span class="muted">—</span>'};
  case"money":return{h:R(v(col.k)),m:1};
  case"kit":{const k=kits().find(x=>x.id===a.kit);return{h:k?esc(k.nome):'<span class="muted">Escolher</span>'};}
  case"pagto":{const s=payStatus(t,a);return{h:s.l,c:s.c};}
  case"envio":{const e=ENVIO.find(x=>x[0]===a.envio)||ENVIO[0];return{h:e[0],c:e[1]};}
  case"yesno":return a[col.k]==="Sim"?{h:"Sim",c:"g"}:a[col.k]==="Não"?{h:"Não",c:"r"}:{h:'<span class="muted">—</span>'};
  case"mes":{const x=Number((a.mes||{})[col.k])||0,p=t.parcela||0;return{h:x?R(x):'<span>—</span>',m:1,c:!x?"r":p&&x<p?"o":"g"};}
  case"soma":return{h:R(payStatus(t,a).pago),m:1};
  case"x":{const c=col.c,x=(a.x||{})[c.id];if(c.tipo==="opcoes"){const o=(c.ops||[]).find(y=>y.t===x);return o?{h:esc(o.t),c:o.c!=="n"?o.c:""}:{h:'<span class="muted">—</span>'};}
    if(c.tipo==="simnao")return x==="Sim"?{h:"Sim",c:"g"}:x==="Não"?{h:"Não",c:"r"}:{h:'<span class="muted">—</span>'};if(c.tipo==="valor")return{h:R(x),m:1};if(c.tipo==="data")return{h:x?fdate(x):'<span class="muted">—</span>'};
    return{h:esc((x||"").slice(0,40))||'<span class="muted">—</span>'};}}return{h:""};}
function vTurma(){const t=D.turmas.find(x=>x.id===VIEW.id);if(!t)return topBar("Turma")+'<p class="empty">Esta turma foi excluída.</p>';VIEW._keep=1;

  const al=D.alunos.filter(a=>a.turma===t.id).sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt")).filter(a=>!q||(a.nome||"").toLowerCase().includes(q)||(a.contato||"").includes(q));
  const s=stats(t.id);const sk=cols.findIndex(c=>c.k==="nome");
  on(()=>{$("q").oninput=e=>{VIEW.q=e.target.value;render();};$("aAdd").onclick=()=>addAlunos(t);$("cols").onclick=()=>colsManager(t);$("tCfg").onclick=()=>turmaForm(t.id);$("csv").onclick=()=>csv(t);
    qa(".sh [data-c]").forEach(b=>b.onclick=()=>{const [aid,k]=b.dataset.c.split("|");if(k==="nome"||k==="soma")openRow(t,aid);else editCell(t,aid,k);});});
  return topBar(esc(t.nome),true,`<button class="back" id="tCfg" aria-label="Configurar turma">⚙️</button>`)+`<p class="muted small" style="margin:12px 0 0">${esc(i.nome||"")} · ${t.modelo==="mensal"?`Mensalidades · parcela ${R(t.parcela)}`:"Formatura e kits"}</p>
  <div class="sum"><div><b>${s.n}</b><span>alunos</span></div><div><b>${R(s.pago)}</b><span>arrecadado</span></div><div><b>${R(Math.max(0,s.tot-s.pago))}</b><span>a receber</span></div>
   <div><b><span class="st g">${s.g}</span> <span class="st o">${s.o}</span> <span class="st r">${s.r}</span></b><span>pago · parcial · não pago</span></div></div>
  <div class="tools"><input id="q" placeholder="🔎 Buscar aluno" value="${esc(VIEW.q||"")}"><button class="btn sm" id="aAdd">＋ Aluno</button><button class="btn ghost sm" id="cols">Colunas</button><button class="btn ghost sm" id="csv">⬇ CSV</button></div>
  <div class="wrap"><table class="sh"><thead><tr>${cols.map((c,j)=>`<th class="${j===sk?"c0":""}">${esc(c.n)}</th>`).join("")}</tr></thead>
  <tbody>${al.map(a=>`<tr>${cols.map((c,j)=>{const v=cellView(t,a,c);return `<td class="${j===sk?"c0":""} ${v.c||""}"><button data-c="${a.id}|${c.k}" class="${v.m?"money":""}">${v.h}</button></td>`;}).join("")}</tr>`).join("")}</tbody></table>
  ${al.length?"":'<p class="empty" style="padding:14px">Nenhum aluno. Toque em ＋ Aluno.</p>'}</div>
  <p class="tiny muted" style="margin-top:8px">Toque numa célula para editar. Toque no nome para ver a ficha completa. As cores mudam sozinhas: vermelho (não pago), laranja (parcial), verde (pago).</p>`;}
function addAlunos(t){sheet(`<div class="grab"></div><h2>Adicionar alunos</h2><p class="small muted">Um nome por linha. Para incluir o contato, use “Nome; telefone”.</p>
  <label class="fld"><textarea id="aL" style="min-height:160px" placeholder="Ana Beatriz Bezerra; 88999990000&#10;João Gabriel da Silva"></textarea></label><div class="btns"><button class="btn full" id="aS">Adicionar</button></div>`);
  $("aS").onclick=async()=>{const ls=$("aL").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!ls.length)return;

/* ---------- equipe e ajustes ---------- */
function vEquipe(){on(()=>qa("[data-u]").forEach(b=>b.onclick=()=>openMember(b.dataset.u)));
  return topBar("Equipe")+`<div class="menu" style="margin-top:14px">${D.users.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(u=>`<button class="mi" data-u="${u.id}" style="align-items:center;text-align:center">${avatar(u.id,"ava lg")}<b>${esc(u.nome)} ${esc(u.sobrenome||"")}</b><span>${esc(u.tel||"")}${u.id===UID?" · você":""}</span></button>`).join("")}</div>`;}
function openMember(id){const u=user(id),tel=(u.tel||"").replace(/\D/g,"");
  sheet(`<div class="grab"></div><div style="text-align:center">${avatar(id,"ava xl")}<h2 style="margin-top:10px">${esc(uname(id))}</h2><p class="muted">${esc(u.tel||"")}</p></div>
  <div class="btns">${tel?`<a class="btn ghost full" href="tel:${tel}">📞 Ligar</a><a class="btn ghost full" href="https://wa.me/55${tel.replace(/^55/,"")}" target="_blank" rel="noopener">💬 WhatsApp</a>`:""}${id!==UID?`<button class="btn full" id="uM">✅ Enviar missão ou aviso</button>`:""}</div>`);
  const b=$("uM");if(b)b.onclick=()=>newMissao(id);}
function vAjustes(){on(()=>{$("aPf").onclick=()=>{sheet(`<div class="grab"></div><h2>Meu perfil</h2>${profileForm(false,ME)}`);bindProfileForm(false,closeSheet);};$("aKit").onclick=kitsManager;$("aEq").onclick=()=>go({v:"equipe"});
    const n=$("aNt");if(n)n.onclick=enableNotif;$("aOut").onclick=()=>{if(confirm("Sair da conta neste aparelho?")){STARTED=false;B.signOut();}};});
  const np="Notification" in window?Notification.permission:"unsupported";
  return topBar("Perfil e ajustes")+`<div class="card row" style="margin-top:14px">${avatar(UID,"ava lg")}<div class="grow"><b style="font-size:1.1rem">${esc(uname(UID))}</b><div class="muted small">${esc(ME.tel||"")}</div></div><button class="btn ghost sm" id="aPf">Editar</button></div>
  <div class="lbl">Equipe e planilhas</div><button class="item" id="aKit"><span class="e">🎁</span><div class="grow"><b>Kits</b><span class="tiny muted">${kits().length} kit(s) cadastrados</span></div><span class="chev">›</span></button>
  <button class="item" id="aEq"><span class="e">👥</span><div class="grow"><b>Equipe</b><span class="tiny muted">${D.users.length} membro(s)</span></div><span class="chev">›</span></button>
  <div class="lbl">Notificações</div><div class="card small">${np==="granted"?"🔔 Ativadas neste aparelho.":np==="denied"?"🔕 Bloqueadas. Libere nas configurações do celular.":np==="unsupported"?"Este navegador não suporta notificações.":`<button class="btn full" id="aNt">🔔 Ativar notificações</button>`}
   <p class="tiny muted" style="margin:8px 0 0">${!B.demo&&CFG.vapidKey?"Avisos chegam mesmo com o app fechado.":"Os avisos chegam com o app aberto ou em segundo plano."}</p></div>
  <div class="lbl">Conta</div><button class="btn ghost full" id="aOut">Sair da conta</button>
  ${B.demo?`<div class="demo">Modo demonstração: dados só neste aparelho.</div>`:""}
  <p class="foot"><img src="${LOGO}" alt="" style="width:56px;height:56px"><br>G3 Formatura · versão 1.0<br>Produzido por ${AUTHOR}</p>`;}
/* ================= FOLHA, AVISOS ================= */
function sheet(h,after){$("sheet").innerHTML=`<div class="in" role="dialog" aria-modal="true">${h}</div>`;$("sheet").classList.remove("hidden");guard();if(after)after();}
function closeSheet(){$("sheet").classList.add("hidden");$("sheet").innerHTML="";}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet();});
function toast(e,t,s){const d=document.createElement("div");d.className="toast";d.innerHTML=`<span class="e">${e}</span><div><b>${esc(t)}</b>${s?`<span>${esc(s)}</span>`:""}</div>`;$("toasts").appendChild(d);setTimeout(()=>d.remove(),3400);}
try{history.replaceState({g:0},"");}catch(e){}

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
