<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G3 Formatura</title>
<meta name="description" content="G3 Formatura: agenda, planilhas das escolas e faculdades, notas e missões da equipe. Produzido por Flávio S. Praciano.">
<meta name="theme-color" content="#0B0B0D">
<meta name="color-scheme" content="dark light">
<meta name="g3-version" content="1.0.0">
<link rel="manifest" href="g3-app-v1.webmanifest">
<link rel="icon" type="image/png" href="g3-icon-192.png">
<link rel="apple-touch-icon" href="g3-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="G3">
<style>
:root{--bg:#0B0B0D;--sf:#17171B;--sf2:#212127;--sf3:#2C2C34;--line:#3A3A44;--ink:#FFFFFF;--soft:#C9C5BB;--faint:#9A968C;--gold:#FFC233;--gold2:#FFD966;--goldd:#B8860B;--btn:#FFC233;--btntx:#111111;
--ghost:#2A2A31;--ghostbd:#55555F;--ghosttx:#FFFFFF;--link:#FFD24D;--red:#F0443F;--org:#FF9F1A;--grn:#2FC46B;--blue:#5B9BFF;--danger:#FF7A75;
--topbg:rgba(11,11,13,.94);--navbg:rgba(18,18,22,.98);--thbg:#2B2410;--thtx:#FFD966;--thbd:#5A4A1C;--zebra:#1D1D22;--toastbg:#24201A;--toastbd:#6B5520;--herobg:linear-gradient(160deg,#211B0C,#0F0F12);--herobd:#5C4A1A;--herotx:#FFF1C8;
--cr:rgba(240,68,63,.24);--crt:#FFB1AE;--co:rgba(255,159,26,.24);--cot:#FFD08A;--cg:rgba(47,196,107,.24);--cgt:#A6F2C4;--r:16px;color-scheme:dark;--disp:Georgia,"Times New Roman",serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="light"]{--bg:#F6F4EF;--sf:#FFFFFF;--sf2:#F0EDE5;--sf3:#E4DFD3;--line:#D5CFC1;--ink:#15130E;--soft:#4F4A3E;--faint:#7A7466;--gold:#E0A100;--gold2:#B07D00;--goldd:#8A6200;--btn:#FFC233;--btntx:#111111;
--ghost:#FFFFFF;--ghostbd:#B9B2A2;--ghosttx:#15130E;--link:#9A6A00;--red:#D7322D;--org:#E67E00;--grn:#1E9E50;--blue:#1E62D0;--danger:#C62828;
--topbg:rgba(246,244,239,.95);--navbg:rgba(255,255,255,.98);--thbg:#15130E;--thtx:#FFD24D;--thbd:#15130E;--zebra:#FAF8F3;--toastbg:#15130E;--toastbd:#15130E;--herobg:linear-gradient(160deg,#FFF4D6,#FFFFFF);--herobd:#EBCB7A;--herotx:#3A2E10;
--cr:#FDE3E1;--crt:#B3201B;--co:#FFEBD0;--cot:#9A4F00;--cg:#DDF5E6;--cgt:#146C37;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hidden{display:none!important}
.app{max-width:760px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;margin:0 -14px;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font:700 1.08rem var(--body);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:var(--ghost);border:2px solid var(--ghostbd);color:var(--ghosttx);width:38px;height:38px;border-radius:12px;font-size:1.2rem;flex:none}
.ava{width:34px;height:34px;border-radius:10px;object-fit:cover;background:var(--sf3);flex:none;border:1px solid var(--line)}
.ava.lg{width:72px;height:72px;border-radius:18px}.ava.xl{width:180px;height:180px;border-radius:24px}
.logo{width:40px;height:40px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--btn);color:var(--btntx);box-shadow:0 3px 0 rgba(0,0,0,.25);text-decoration:none;forced-color-adjust:none}
.btn.ghost{background:var(--ghost);color:var(--ghosttx);border:2px solid var(--ghostbd);box-shadow:none}.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:11px}.btn.full{width:100%}.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--link);font-weight:800;padding:6px;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lbl{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.muted{color:var(--soft)}.small{font-size:.88rem}.tiny{font-size:.76rem}
.fld{display:block;margin:10px 0}.fld span{display:block;font-size:.8rem;font-weight:700;color:var(--soft);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.fld textarea{min-height:90px;resize:vertical}.cnt{font-size:.74rem;color:var(--faint);text-align:right;margin-top:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--line);background:var(--sf2);border-radius:10px;padding:7px 11px;font-weight:700;font-size:.86rem}
.seg button[aria-pressed="true"]{border-color:var(--btn);background:var(--btn);color:var(--btntx)}
/* status */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.76rem;white-space:nowrap}
.st.r{background:var(--red);color:#FFFFFF}.st.o{background:var(--org);color:#1A1000}.st.g{background:var(--grn);color:#FFFFFF}.st.n{background:var(--sf3);color:var(--soft)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
/* home */
.hero{margin-top:14px;border-radius:22px;padding:18px;background:var(--herobg);border:2px solid var(--herobd)}
.hero h2{font:700 1.5rem/1.15 var(--disp);margin:6px 0 0}.hero .q{margin:14px 0 0;font:italic 1.04rem/1.45 var(--disp);color:var(--herotx)}.hero .a{font-size:.84rem;color:var(--gold2);margin-top:6px;font-weight:800}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:104px;position:relative}
.mi .e{font-size:1.5rem}.mi b{font-size:.98rem}.mi span{font-size:.78rem;color:var(--soft)}
.mi .bd{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 7px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.task .ic{font-size:1.15rem;width:24px;text-align:center}
.empty{color:var(--faint);font-size:.88rem;padding:6px 0}
/* listas */
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item .e{font-size:1.35rem;width:34px;height:34px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;flex:none}
.item b{display:block}.item .chev{color:var(--faint);font-size:1.2rem}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem;margin:12px 0 4px}.crumbs button{background:none;border:0;color:var(--gold2);padding:2px 4px;font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:18px;border:0;font-size:1.8rem;font-weight:800;background:var(--btn);color:var(--btntx);box-shadow:0 10px 24px rgba(0,0,0,.5)}
/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--navbg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.62rem;font-weight:700;color:var(--faint);padding:4px 0;position:relative}
.nav button .i{font-size:1.25rem}.nav button[aria-current="true"]{color:var(--gold2)}.nav button[aria-current="true"] .i{transform:scale(1.12)}
.nav .bd{position:absolute;top:0;right:22%;background:var(--red);color:#fff;border-radius:99px;font-size:.62rem;padding:0 5px}
/* folha (modal) */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--sf);border:1px solid var(--line);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}.sheet h2{font:700 1.2rem var(--body);margin:0 0 6px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:.7rem;color:var(--faint);text-align:center;font-weight:800}
.cal button{aspect-ratio:1;border:1px solid transparent;background:var(--sf);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.9rem;padding:0}
.cal button.out{opacity:.3}.cal button.td{border-color:var(--gold)}.cal button.sel{background:var(--btn);color:var(--btntx)}
.cal .dots{display:flex;gap:2px;height:5px}.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--gold2)}.cal button.sel .dots i{background:var(--btntx)}
.ev{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ev .t{font-weight:800;font-size:.86rem;color:var(--gold2);min-width:46px}
/* planilha */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.sum div:last-child{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sum div:last-child b{display:flex;gap:6px}
.sum div{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.sum b{display:block;font-size:1.05rem}.sum span{font-size:.72rem;color:var(--soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tools input{flex:1;min-width:140px;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:68vh;background:var(--sf)}
table.sh{border-collapse:separate;border-spacing:0;font-size:.86rem;min-width:100%}
.sh th{position:sticky;top:0;z-index:2;background:var(--thbg);color:var(--thtx);font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:9px 10px;white-space:nowrap;border-bottom:2px solid var(--thbd)}
.sh td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.sh td>button{display:block;width:100%;min-height:42px;text-align:left;background:none;border:0;padding:8px 10px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.sh tr:nth-child(even) td{background:var(--zebra)}
.sh .c0{position:sticky;left:0;z-index:1;background:var(--sf)!important;font-weight:700;box-shadow:2px 0 0 var(--line)}.sh td.c0>button{max-width:150px;white-space:normal;line-height:1.25}@media (min-width:600px){.sh td.c0>button{max-width:240px}}.sh th.c0{z-index:3;background:var(--thbg)!important}
.sh td.r>button{background:var(--cr);color:var(--crt);font-weight:800}.sh td.o>button{background:var(--co);color:var(--cot);font-weight:800}.sh td.g>button{background:var(--cg);color:var(--cgt);font-weight:800}
.money{font-variant-numeric:tabular-nums;text-align:right!important}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px;font-weight:700}
.opt.on{border:2px solid var(--gold);background:var(--sf3)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.dot.r{background:var(--red)}.dot.o{background:var(--org)}.dot.g{background:var(--grn)}.dot.n{background:var(--faint)}
/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(30px + env(safe-area-inset-top,0px)) 18px 30px;background:var(--herobg)}
.auth .box{width:100%;max-width:420px}.auth h1{font:700 1.7rem var(--disp);text-align:center;margin:12px 0 2px}
.photo-pick{display:flex;align-items:center;gap:12px}.photo-pick img{width:84px;height:84px;border-radius:18px;object-fit:cover;background:var(--sf3);border:1px solid var(--line)}
.demo{background:var(--co);border:2px solid var(--org);color:var(--cot);font-weight:700;border-radius:12px;padding:10px 12px;font-size:.82rem;margin-top:12px}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--toastbg);color:#FFFFFF;border:2px solid var(--toastbd);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .25s}
.toast .e{font-size:1.3rem}.toast b{display:block}.toast span{font-size:.82rem;color:#E6E1D5}

@media (min-width:700px){.menu{grid-template-columns:repeat(3,1fr)}}

.theme{background:var(--ghost);border:2px solid var(--ghostbd);width:38px;height:38px;border-radius:12px;font-size:1.1rem;flex:none}
.danger{color:var(--danger)!important;border-color:var(--danger)!important}
.exit{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.exit .box{background:var(--sf);border:2px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:360px;text-align:center}
.exit h2{font:800 1.25rem var(--body);margin:8px 0 6px}

.logo.sm{width:26px;height:26px;margin-left:-2px}
.foot{text-align:center;color:var(--soft);font-size:.98rem;margin:30px 0 6px;line-height:1.4}.foot b{color:var(--ink);font-weight:800}
.foot .flat{width:78px;display:block;margin:0 auto 6px;opacity:.9}:root:not([data-theme="light"]) .foot .flat{filter:invert(1) hue-rotate(180deg)}
.calcbtn{margin-top:22px;padding:16px;font-size:1.05rem;background:linear-gradient(135deg,var(--grn),#1A8F4A);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.years{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}.yr{background:var(--sf);border:2px solid var(--ghostbd);border-radius:16px;padding:12px;text-align:left;color:var(--ink)}
.yr b{display:block;font-size:1.5rem;line-height:1.1}.yr span{font-size:.8rem;color:var(--soft)}.yr.on{background:var(--btn);border-color:var(--btn);color:var(--btntx)}.yr.on span{color:var(--btntx)}
:root{--evbg:rgba(255,194,51,.26)}:root[data-theme="light"]{--evbg:#FFE7A1}
.cal button.has{background:var(--evbg);border:2px solid var(--gold);font-weight:900}.cal button.has .dots i{background:var(--red);width:6px;height:6px}
.cal button.td{border:2px solid var(--blue)}.cal button.sel{background:var(--btn);color:var(--btntx);border-color:var(--btn)}
.ev{border-left:6px solid var(--btn)}
.profit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.profit .pc{border-radius:16px;padding:12px;border:2px solid}
.profit .pc span{display:block;font-size:.78rem;font-weight:800}.profit .pc b{display:block;font-size:1.35rem;margin:2px 0}.profit .pc small{font-size:.74rem;opacity:.85}
.profit .ok{background:var(--cg);border-color:var(--grn);color:var(--cgt)}.profit .ideal{background:var(--evbg);border-color:var(--gold);color:var(--ink)}
.profit.sm .pc b{font-size:1.1rem}.profit.sm{margin:0 0 16px}
.item.hl{border:2px solid var(--gold);background:var(--evbg)}
.msg{margin-bottom:10px}.msg .mt{white-space:pre-wrap;background:var(--sf2);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.taxhd{background:linear-gradient(135deg,#1E8E3E,#0B5D24);color:#fff;padding:12px 14px}.taxhd b{display:block;font-size:1.2rem}.taxhd span{font-size:.82rem;opacity:.9}
table.tax{width:100%;border-collapse:collapse}table.tax th{background:#7BD389;color:#0B3D18;text-align:left;padding:8px 14px}table.tax th:last-child{background:#0B5D24;color:#fff}
table.tax td{padding:8px 14px;border-bottom:1px solid var(--line);font-weight:700}table.tax td:last-child{font-size:1.05rem;color:var(--ink)}
.lhead{margin:22px 0 8px;display:flex;flex-direction:column;gap:6px}.lhead b{font-size:1.08rem}

</style>
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="main" class="hidden"><div class="app" id="view"></div></div>
<nav class="nav hidden" id="nav" aria-label="Navegação"><div class="in" id="navIn"></div></nav>
<div id="sheet" class="sheet hidden"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
const LOGO="g3-logo.png";
const LOGO_PRINT="g3-logo-flat.png";
"use strict";
/* ================= MARCA E RODAPÉ ================= */
function FOOT(){return `<div class="foot"><img class="flat" src="${LOGO_PRINT}" alt="Grupo G3 Formatura"><div>Produzido por <b>${AUTHOR}</b></div></div>`;}
const ANOS=["2026","2027"];const instAno=i=>i.ano||"2026";
const curAno=()=>VIEW.ano||localStorage.getItem("g3_ano")||"2026";
const byName=(a,b)=>(a.nome||"").localeCompare(b.nome||"","pt",{numeric:true});
/* ================= BIBLIOTECAS (carregadas só quando precisa) ================= */
const LIBS={};
function loadLib(u){return LIBS[u]=LIBS[u]||new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>{delete LIBS[u];no(new Error("offline"));};document.head.appendChild(s);});}
const U_PDF="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",U_AT="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js",U_XL="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
async function pdfLib(){await loadLib(U_PDF);await loadLib(U_AT);return window.jspdf.jsPDF;}
let LOGO_DATA=null;
async function logoData(){if(LOGO_DATA)return LOGO_DATA;const im=new Image();im.src=LOGO_PRINT;await im.decode();const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext("2d").drawImage(im,0,0);
  LOGO_DATA={d:c.toDataURL("image/png"),r:im.naturalHeight/im.naturalWidth};return LOGO_DATA;}
function saveBlob(blob,name){const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download=name;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove();},2000);}
const fsafe=s=>String(s||"arquivo").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").slice(0,60)||"arquivo";
const plain=h=>String(h==null?"":h).replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/^—$/,"").trim();
const isMoney=c=>["money","mes","soma"].includes(c.t)||(c.t==="x"&&c.c.tipo==="valor");

function cellRaw(t,a,c){if(c.t==="money")return Number(a[c.k])||0;if(c.t==="mes")return Number((a.mes||{})[c.k])||0;if(c.t==="soma")return payStatus(t,a).pago;if(c.t==="x"&&c.c.tipo==="valor")return Number((a.x||{})[c.c.id])||0;return cellText(t,a,c);}

function lucroAluno(t,a){if(t.modelo==="mensal"){const preco=(t.parcela||0)*(t.meses||[]).length,custo=Number(t.custoAluno)||0,pago=payStatus(t,a).pago;
    return{pacote:"Mensalidades",custo,preco,lucro:preco-custo,pago,atual:preco>0?Math.min(pago,preco)*(preco-custo)/preco:0};}
  const k=kits().find(x=>x.id===a.kit),preco=Number(a.total)||(k?Number(k.preco):0)||0,custo=k?Number(k.custo)||0:0,pago=Number(a.pago)||0;
  return{pacote:k?k.nome:"Sem kit",custo,preco,lucro:preco-custo,pago,atual:preco>0?Math.min(pago,preco)*(preco-custo)/preco:0};}
function lucroData(ano){return D.inst.filter(i=>ano==="todos"||instAno(i)===ano).sort(byName).map(i=>{
  const tt=D.turmas.filter(t=>t.inst===i.id).sort(byName).map(t=>{const rows=D.alunos.filter(a=>a.turma===t.id).sort(byName).map(a=>Object.assign({nome:a.nome},lucroAluno(t,a)));
    const sm=k=>rows.reduce((s,r)=>s+r[k],0);return{t,rows,atual:sm("atual"),ideal:sm("lucro"),pago:sm("pago"),custo:sm("custo"),preco:sm("preco")};}).filter(x=>x.rows.length);
  return{i,tt,atual:tt.reduce((s,x)=>s+x.atual,0),ideal:tt.reduce((s,x)=>s+x.ideal,0),pago:tt.reduce((s,x)=>s+x.pago,0)};}).filter(x=>x.tt.length);}

function turmaForm(id,inst){const t=id?D.turmas.find(x=>x.id===id):{inst,modelo:"formatura",meses:MESES_PAD.split(", "),parcela:0};let mod=t.modelo;

   :`<p class="tiny muted">Colunas: turma, nome, contato, kit, status de pagamento, envio das fotos, pago, total, foto da placa e observações. Você pode adicionar ou ocultar colunas depois.</p>`}
   <div class="btns"><button class="btn full" id="tS">Salvar</button>${id?`<button class="btn ghost full" id="tD" style="color:var(--danger)">Excluir turma</button>`:""}</div>`);
   const m=$("tM");if(m)m.onclick=e=>{const b=e.target.closest("button");if(!b)return;t.nome=$("tN").value;mod=b.dataset.v;draw();};
   $("tS").onclick=async()=>{const n=$("tN").value.trim();if(!n)return toast("⚠️","Dê um nome à turma","");const v={nome:n};
     if(mod==="mensal"){v.meses=$("tMs").value.split(",").map(s=>s.trim()).filter(Boolean);v.parcela=money($("tP").value);v.custoAluno=money($("tCu").value);}
     if(id)await B.update("turmas",id,v);else await B.add("turmas",Object.assign(v,{inst:t.inst,modelo:mod,cols:[],hide:[],criado:Date.now(),autor:UID}));closeSheet();};
   const d=$("tD");if(d)d.onclick=()=>{const n=D.alunos.filter(a=>a.turma===id).length;if(confirm(`Excluir a turma e ${n} aluno(s)? Isso vale para toda a equipe.`)){D.alunos.filter(a=>a.turma===id).forEach(a=>B.del("alunos",a.id));B.del("turmas",id);closeSheet();back();}};};draw();}
/* ---------- planilha ---------- */
const ENVIO=[["Não enviado","r"],["Em andamento","o"],["Enviado","g"]];
function columns(t){let c;if(t.modelo==="mensal")c=[{k:"nome",n:"Aluno",t:"text",fix:1},...(t.meses||[]).map((m,i)=>({k:"m"+i,n:m,t:"mes",i})),{k:"soma",n:"Soma das parcelas",t:"soma"},{k:"pagto",n:"Status",t:"pagto"},{k:"obs",n:"Observações",t:"long"}];
  else c=[{k:"turmaTxt",n:"Turma",t:"text"},{k:"nome",n:"Nome completo",t:"text",fix:1},{k:"contato",n:"Contato",t:"text"},{k:"kit",n:"Kit",t:"kit"},{k:"pagto",n:"Status de pagamento",t:"pagto"},{k:"envio",n:"Envio das fotos",t:"envio"},
    {k:"pago",n:"Pago",t:"money"},{k:"total",n:"Total a pagar",t:"money"},{k:"placa",n:"Foto da placa confirmada",t:"yesno"},{k:"obs",n:"Observações",t:"long"}];
  c=c.filter(x=>x.fix||!(t.hide||[]).includes(x.k));(t.cols||[]).forEach(x=>c.push({k:"x_"+x.id,n:x.nome,t:"x",c:x}));return c;}
function payStatus(t,a){if(!t)return{c:"r",l:"—",pago:0,total:0};let pago,total;
  if(t.modelo==="mensal"){pago=(t.meses||[]).reduce((s,m,i)=>s+(Number((a.mes||{})["m"+i])||0),0);total=(t.parcela||0)*(t.meses||[]).length;}else{pago=Number(a.pago)||0;total=Number(a.total)||0;}
  if(total>0&&pago>=total)return{c:"g",l:"Pago",pago,total};if(pago>0)return{c:"o",l:total?`Parcial · ${Math.round(pago/total*100)}%`:"Pagamento registrado",pago,total};return{c:"r",l:"Não pago",pago,total};}
function cellView(t,a,col){const v=k=>a[k];switch(col.t){
  case"text":return{h:esc(v(col.k)||"")||(col.k==="turmaTxt"?esc(t.nome):'<span class="muted">—</span>')};
  case"long":return{h:esc((v(col.k)||"").slice(0,40))+((v(col.k)||"").length>40?"…":"")||'<span class="muted">—</span>'};
  case"money":return{h:R(v(col.k)),m:1};
  case"kit":{const k=kits().find(x=>x.id===a.kit);return{h:k?esc(k.nome):'<span class="muted">Escolher</span>'};}
  case"pagto":{const s=payStatus(t,a);return{h:s.l,c:s.c};}
  case"envio":{const e=ENVIO.find(x=>x[0]===a.envio)||ENVIO[0];return{h:e[0],c:e[1]};}
  case"yesno":return a[col.k]==="Sim"?{h:"Sim",c:"g"}:a[col.k]==="Não"?{h:"Não",c:"r"}:{h:'<span class="muted">—</span>'};
  case"mes":{const x=Number((a.mes||{})[col.k])||0,p=t.parcela||0;return{h:x?R(x):'<span>—</span>',m:1,c:!x?"r":p&&x<p?"o":"g"};}
  case"soma":return{h:R(payStatus(t,a).pago),m:1};
  case"x":{const c=col.c,x=(a.x||{})[c.id];if(c.tipo==="opcoes"){const o=(c.ops||[]).find(y=>y.t===x);return o?{h:esc(o.t),c:o.c!=="n"?o.c:""}:{h:'<span class="muted">—</span>'};}
    if(c.tipo==="simnao")return x==="Sim"?{h:"Sim",c:"g"}:x==="Não"?{h:"Não",c:"r"}:{h:'<span class="muted">—</span>'};if(c.tipo==="valor")return{h:R(x),m:1};if(c.tipo==="data")return{h:x?fdate(x):'<span class="muted">—</span>'};
    return{h:esc((x||"").slice(0,40))||'<span class="muted">—</span>'};}}return{h:""};}
function vTurma(){const t=D.turmas.find(x=>x.id===VIEW.id);if(!t)return topBar("Turma")+'<p class="empty">Esta turma foi excluída.</p>';VIEW._keep=1;
  const i=D.inst.find(x=>x.id===t.inst)||{};const q=(VIEW.q||"").toLowerCase();const cols=columns(t);
  const al=D.alunos.filter(a=>a.turma===t.id).sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt")).filter(a=>!q||(a.nome||"").toLowerCase().includes(q)||(a.contato||"").includes(q));
  const s=stats(t.id);const sk=cols.findIndex(c=>c.k==="nome");
  on(()=>{$("q").oninput=e=>{VIEW.q=e.target.value;render();};$("aAdd").onclick=()=>addAlunos(t);$("cols").onclick=()=>colsManager(t);$("tCfg").onclick=()=>turmaForm(t.id);$("csv").onclick=()=>exportMenu(t);

  return topBar(esc(t.nome),true,`<button class="back" id="tCfg" aria-label="Configurar turma">⚙️</button>`)+`<p class="muted small" style="margin:12px 0 0">${esc(i.nome||"")} · ${t.modelo==="mensal"?`Mensalidades · parcela ${R(t.parcela)}`:"Formatura e kits"}</p>
  <div class="sum"><div><b>${s.n}</b><span>alunos</span></div><div><b>${R(s.pago)}</b><span>arrecadado</span></div><div><b>${R(Math.max(0,s.tot-s.pago))}</b><span>a receber</span></div>
   <div><b><span class="st g">${s.g}</span> <span class="st o">${s.o}</span> <span class="st r">${s.r}</span></b><span>pago · parcial · não pago</span></div></div>
  <div class="tools"><input id="q" placeholder="🔎 Buscar aluno" value="${esc(VIEW.q||"")}"><button class="btn sm" id="aAdd">＋ Aluno</button><button class="btn ghost sm" id="cols">Colunas</button><button class="btn ghost sm" id="csv">⬇ Baixar</button></div>
  <div class="wrap"><table class="sh"><thead><tr>${cols.map((c,j)=>`<th class="${j===sk?"c0":""}">${esc(c.n)}</th>`).join("")}</tr></thead>
  <tbody>${al.map(a=>`<tr>${cols.map((c,j)=>{const v=cellView(t,a,c);return `<td class="${j===sk?"c0":""} ${v.c||""}"><button data-c="${a.id}|${c.k}" class="${v.m?"money":""}">${v.h}</button></td>`;}).join("")}</tr>`).join("")}</tbody></table>
  ${al.length?"":'<p class="empty" style="padding:14px">Nenhum aluno. Toque em ＋ Aluno.</p>'}</div>
  <p class="tiny muted" style="margin-top:8px">Toque numa célula para editar. Toque no nome para ver a ficha completa. As cores mudam sozinhas: vermelho (não pago), laranja (parcial), verde (pago).</p>`;}
function addAlunos(t){sheet(`<div class="grab"></div><h2>Adicionar alunos</h2><p class="small muted">Um nome por linha. Para incluir o contato, use “Nome; telefone”.</p>
  <label class="fld"><textarea id="aL" style="min-height:160px" placeholder="Ana Beatriz Bezerra; 88999990000&#10;João Gabriel da Silva"></textarea></label><div class="btns"><button class="btn full" id="aS">Adicionar</button></div>`);

function editCell(t,aid,k){const a=D.alunos.find(x=>x.id===aid);if(!a)return;const col=columns(t).find(c=>c.k===k)||{k,t:"text",n:k};const save=p=>B.update("alunos",aid,p);

  const opts=(list,cur,fn)=>{sheet(head+list.map(([l,c])=>`<button class="opt ${l===cur?"on":""}" data-o="${esc(l)}"><span class="dot ${c}"></span>${esc(l)}</button>`).join("")+`<button class="link" id="oClr">Limpar</button>`);
    qa(".sheet [data-o]").forEach(b=>b.onclick=()=>{fn(b.dataset.o);closeSheet();});$("oClr").onclick=()=>{fn("");closeSheet();};};
  const text=(cur,long,fn)=>{sheet(head+`<label class="fld">${long?`<textarea id="cV" style="min-height:140px">${esc(cur||"")}</textarea>`:`<input id="cV" value="${esc(cur||"")}">`}</label><div class="btns"><button class="btn full" id="cS">Salvar</button></div>`);setTimeout(()=>$("cV").focus(),50);
    $("cS").onclick=()=>{fn($("cV").value);closeSheet();};$("cV").onkeydown=e=>{if(e.key==="Enter"&&!long){fn($("cV").value);closeSheet();}};};
  if(col.t==="text")return text(a[k]||(k==="turmaTxt"?t.nome:""),false,v=>save({[k]:v.trim()}));
  if(col.t==="long")return text(a[k],true,v=>save({[k]:v}));
  if(col.t==="kit"){const ks=kits();sheet(head+(ks.length?ks.map(x=>`<button class="opt ${x.id===a.kit?"on":""}" data-k="${x.id}"><span class="grow">${esc(x.nome)}</span><span class="muted">${R(x.preco)}</span></button>`).join(""):'<p class="empty">Nenhum kit cadastrado ainda.</p>')+
    `<div class="btns"><button class="btn ghost full" id="kM">⚙️ Cadastrar e editar kits</button><button class="link" id="kC">Sem kit</button></div>`);
    qa(".sheet [data-k]").forEach(b=>b.onclick=()=>{const kt=ks.find(x=>x.id===b.dataset.k),old=ks.find(x=>x.id===a.kit);const p={kit:kt.id};if(!a.total||(old&&a.total===old.preco))p.total=kt.preco;save(p);closeSheet();});
    $("kM").onclick=kitsManager;$("kC").onclick=()=>{save({kit:""});closeSheet();};return;}
  if(col.t==="envio")return opts(ENVIO,a.envio,v=>save({envio:v||"Não enviado"}));
  if(col.t==="yesno")return opts([["Sim","g"],["Não","r"]],a[k],v=>save({[k]:v}));
  if(col.t==="money"||col.t==="pagto")return payDialog(t,a);
  if(col.t==="mes"){const cur=(a.mes||{})[k]||"";sheet(head+`<label class="fld"><span>Valor pago nesta parcela (R$)</span><input id="cV" inputmode="decimal" value="${cur?String(cur).replace(".",","):""}"></label>
    <div class="btns">${t.parcela?`<button class="btn full" id="cF">Parcela completa · ${R(t.parcela)}</button>`:""}<button class="btn ghost full" id="cS">Salvar valor</button><button class="link" id="cZ">Zerar</button></div>`);setTimeout(()=>$("cV").focus(),50);
    const f=$("cF");if(f)f.onclick=()=>{save({mes:{[k]:t.parcela}});closeSheet();};$("cS").onclick=()=>{save({mes:{[k]:money($("cV").value)}});closeSheet();};$("cZ").onclick=()=>{save({mes:{[k]:0}});closeSheet();};return;}
  if(col.t==="x"){const c=col.c,cur=(a.x||{})[c.id];const sx=v=>save({x:{[c.id]:v}});
    if(c.tipo==="opcoes")return opts((c.ops||[]).map(o=>[o.t,o.c]),cur,sx);if(c.tipo==="simnao")return opts([["Sim","g"],["Não","r"]],cur,sx);
